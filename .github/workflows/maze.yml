name: Ideas Pusher (Fusion Ultimate 1.0.1)

on:
  repository_dispatch:
    types: [run_X]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fusion-ultimate
  cancel-in-progress: true

env:
  BINANCE_BASE: "https://fapi.binance.com"

  GIST_ID: ${{ vars.GIST_ID }}
  GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

  WORKER_PUSH_URL: ${{ secrets.WORKER_PUSH_URL }}
  WORKER_PUSH_URL_V2: ${{ secrets.WORKER_PUSH_URL_V2 }}

  MIN_24H_VOLUME_USD: ${{ vars.MIN_24H_VOLUME_USD }}
  TOP_N_REFINED: ${{ vars.TOP_N_REFINED }}
  FUNDING_WEIGHT: ${{ vars.FUNDING_WEIGHT }}
  OI_DELTA_WEIGHT: ${{ vars.OI_DELTA_WEIGHT }}
  VOLUME_WEIGHT: ${{ vars.VOLUME_WEIGHT }}
  VOLATILITY_WEIGHT: ${{ vars.VOLATILITY_WEIGHT }}

  MAX_SPREAD_BPS: ${{ vars.MAX_SPREAD_BPS }}
  OBI_TOPN: ${{ vars.OBI_TOPN }}
  MAX_SLIPPAGE_BPS: ${{ vars.MAX_SLIPPAGE_BPS }}
  DEPTH_USD_CHECK: ${{ vars.DEPTH_USD_CHECK }}

  LEVERAGE: ${{ vars.LEVERAGE }}
  MC_SIMULATIONS: ${{ vars.MC_SIMULATIONS }}
  MC_HORIZON_MIN: ${{ vars.MC_HORIZON_MIN }}
  TARGET_PROFIT_MULT: ${{ vars.TARGET_PROFIT_MULT }}
  MAX_LIQ_PROB: ${{ vars.MAX_LIQ_PROB }}

  HEDGE: ${{ vars.HEDGE }}

  VALIDATION_WAIT_SEC: ${{ vars.VALIDATION_WAIT_SEC }}

  IDEA_TTL_MIN: ${{ vars.IDEA_TTL_MIN }}
  SYMBOL_COOLDOWN_MIN: ${{ vars.SYMBOL_COOLDOWN_MIN }}

  BINANCE_CONCURRENCY: ${{ vars.BINANCE_CONCURRENCY }}
  FETCH_MAX_RETRIES: ${{ vars.FETCH_MAX_RETRIES }}
  FETCH_BASE_DELAY_MS: ${{ vars.FETCH_BASE_DELAY_MS }}
  WEIGHT_WARN_THRESHOLD: ${{ vars.WEIGHT_WARN_THRESHOLD }}

jobs:
  push-ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write engine
        run: |
          cat > fusion.js <<'JSEOF'

          // ============================================================
          //  Fusion Ultimate 1.0.1 — engine
          //  Sources: Binance Futures (USDT perpetuals)
          //  Pipeline:
          //    1. Golden-metrics universe scan (funding + OI + vol + volat)
          //    2. Execution-quality gate (spread / OBI / slippage) — enforced
          //    3. Side selection (trend + funding fade + OI confirmation)
          //    4. Monte Carlo liquidation + 2x-profit probability model
          //    5. Single shared validation wait (30-60 s) — parallelised
          //    6. Push ideas to WORKER_PUSH_URL(s)
          //    7. Incremental Gist state checkpoint
          // ============================================================

          "use strict";

          const BINANCE_BASE = process.env.BINANCE_BASE || "https://fapi.binance.com";

          // ----------------------------------------------------------------
          //  CONFIG — every knob is a repo variable with a safe default
          // ----------------------------------------------------------------
          const CFG = {
            // universe
            minVolUsd:        Number(process.env.MIN_24H_VOLUME_USD  || "5000000"),
            topNRefined:      Number(process.env.TOP_N_REFINED        || "30"),
            // golden metric weights (must sum to 1.0 conceptually, normalised internally)
            wFunding:         Number(process.env.FUNDING_WEIGHT       || "0.3"),
            wOI:              Number(process.env.OI_DELTA_WEIGHT      || "0.3"),
            wVol:             Number(process.env.VOLUME_WEIGHT        || "0.2"),
            wVolat:           Number(process.env.VOLATILITY_WEIGHT    || "0.2"),
            // execution gate
            maxSpreadBps:     Number(process.env.MAX_SPREAD_BPS       || "8"),
            obiTopN:          Number(process.env.OBI_TOPN             || "10"),
            maxSlippageBps:   Number(process.env.MAX_SLIPPAGE_BPS     || "12"),
            depthUsdCheck:    Number(process.env.DEPTH_USD_CHECK      || "5000"),
            // risk model
            leverage:         Number(process.env.LEVERAGE             || "5"),
            mcSims:           Number(process.env.MC_SIMULATIONS       || "500"),
            mcHorizonMin:     Number(process.env.MC_HORIZON_MIN       || "60"),
            targetProfitMult: Number(process.env.TARGET_PROFIT_MULT   || "2.0"),
            maxLiqProb:       Number(process.env.MAX_LIQ_PROB         || "0.15"),
            // hedge toggle — OFF by default, never forced
            hedge:            String(process.env.HEDGE || "false").toLowerCase() === "true",
            // validation wait — clamped 30-60 s to prevent timeout risk
            validationWaitSec: Math.min(60, Math.max(30, Number(process.env.VALIDATION_WAIT_SEC || "45"))),
            // cooldown / TTL
            ideaTtlMin:       Number(process.env.IDEA_TTL_MIN         || "20"),
            cooldownMin:      Number(process.env.SYMBOL_COOLDOWN_MIN  || "30"),
            // concurrency / retry
            concurrency:      Number(process.env.BINANCE_CONCURRENCY  || "15"),
            maxRetries:       Number(process.env.FETCH_MAX_RETRIES    || "3"),
            baseDelayMs:      Number(process.env.FETCH_BASE_DELAY_MS  || "300"),
            weightWarnThreshold: Number(process.env.WEIGHT_WARN_THRESHOLD || "1000"),
          };

          const GIST_ID    = process.env.GIST_ID;
          const GIST_TOKEN = process.env.GIST_TOKEN;
          const PUSH_URL   = process.env.WORKER_PUSH_URL;
          const PUSH_URL_V2 = process.env.WORKER_PUSH_URL_V2;

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          // ----------------------------------------------------------------
          //  UTILITY — bounded concurrency map
          //  Runs fn over items with at most `concurrency` in-flight at once.
          //  Errors are caught per-item and returned as { __error, message }.
          // ----------------------------------------------------------------
          async function mapConcurrent(items, concurrency, fn) {
            const results = new Array(items.length);
            let idx = 0;
            async function worker() {
              while (idx < items.length) {
                const current = idx++;
                try {
                  results[current] = await fn(items[current], current);
                } catch (e) {
                  results[current] = { __error: true, message: e.message };
                }
              }
            }
            const poolSize = Math.max(1, Math.min(concurrency, items.length));
            await Promise.all(Array.from({ length: poolSize }, worker));
            return results;
          }

          // ----------------------------------------------------------------
          //  NETWORK — retry-with-backoff wrapper
          //  Handles: transient network errors, 429 (rate-limit), 418 (ban),
          //  5xx server errors.  Surfaces Binance weight header as a warning.
          // ----------------------------------------------------------------
          async function fetchWithRetry(url, options = {}) {
            let lastErr;
            for (let attempt = 0; attempt <= CFG.maxRetries; attempt++) {
              try {
                const res = await fetch(url, options);

                // rate-limit visibility
                const usedWeight = res.headers.get("x-mbx-used-weight-1m");
                if (usedWeight && Number(usedWeight) > CFG.weightWarnThreshold) {
                  console.warn(`[rate-limit] x-mbx-used-weight-1m=${usedWeight} (threshold=${CFG.weightWarnThreshold})`);
                }

                if (res.status === 429 || res.status === 418) {
                  const retryAfter = Number(res.headers.get("retry-after") || "1");
                  const wait = Math.max(retryAfter * 1000, CFG.baseDelayMs * (attempt + 1));
                  console.warn(`[retry] status=${res.status}, waiting ${wait}ms (attempt ${attempt + 1}/${CFG.maxRetries})`);
                  await sleep(wait);
                  continue;
                }
                if (res.status >= 500) {
                  const wait = CFG.baseDelayMs * Math.pow(2, attempt) + Math.random() * 100;
                  console.warn(`[retry] status=${res.status}, waiting ${wait.toFixed(0)}ms (attempt ${attempt + 1}/${CFG.maxRetries})`);
                  await sleep(wait);
                  continue;
                }
                if (!res.ok) {
                  throw new Error(`HTTP ${res.status} — ${url}`);
                }
                return res;
              } catch (e) {
                lastErr = e;
                if (attempt < CFG.maxRetries) {
                  const wait = CFG.baseDelayMs * Math.pow(2, attempt) + Math.random() * 100;
                  await sleep(wait);
                }
              }
            }
            throw lastErr || new Error(`fetchWithRetry exhausted — ${url}`);
          }

          async function binanceGet(path, params = {}) {
            const qs = new URLSearchParams(params).toString();
            const url = `${BINANCE_BASE}${path}${qs ? "?" + qs : ""}`;
            const res = await fetchWithRetry(url);
            return res.json();
          }

          // ----------------------------------------------------------------
          //  STATE — Gist persistence
          //  Stores: cooldowns, lastOI, calibration { total, correct }
          // ----------------------------------------------------------------
          async function loadState() {
            try {
              const res = await fetchWithRetry(`https://api.github.com/gists/${GIST_ID}`, {
                headers: {
                  Authorization: `token ${GIST_TOKEN}`,
                  "User-Agent": "fusion-ultimate",
                },
              });
              const gist = await res.json();
              const file = gist.files["state.json"];
              if (!file) return defaultState();
              try { return JSON.parse(file.content); }
              catch { return defaultState(); }
            } catch (e) {
              console.error("[loadState] failed, starting fresh:", e.message);
              return defaultState();
            }
          }

          function defaultState() {
            return { cooldowns: {}, lastOI: {}, calibration: { total: 0, correct: 0 } };
          }

          async function saveState(state) {
            await fetchWithRetry(`https://api.github.com/gists/${GIST_ID}`, {
              method: "PATCH",
              headers: {
                Authorization: `token ${GIST_TOKEN}`,
                "User-Agent": "fusion-ultimate",
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                files: { "state.json": { content: JSON.stringify(state, null, 2) } },
              }),
            });
          }

          // ----------------------------------------------------------------
          //  CALIBRATION — nudges confidence up/down based on historical accuracy
          //  Requires at least 20 resolved trades before it kicks in.
          // ----------------------------------------------------------------
          function calibratedConfidence(base, calibration) {
            if (!calibration || calibration.total < 20) return base;
            const accuracy = calibration.correct / calibration.total;
            const adj = (accuracy - 0.5) * 0.4; // max ±0.2 nudge
            return Math.max(0.05, Math.min(0.99, base + adj));
          }

          // ----------------------------------------------------------------
          //  PHASE 1 — GOLDEN METRICS UNIVERSE SCAN
          //
          //  Step A: fetch exchangeInfo + 24hr tickers + premiumIndex in parallel
          //  Step B: volume-filter to shrink the OI fetch set
          //  Step C: concurrent OI fetch (bounded by CFG.concurrency)
          //  Step D: score + pre-shortlist (3× topNRefined) by funding + OI
          //  Step E: concurrent klines fetch for volatility (sigma per 5m bar)
          //  Step F: compute final golden score, rank, return top N
          // ----------------------------------------------------------------
          async function scanUniverse(state) {
            console.log("[scan] fetching exchange metadata...");
            const [exchangeInfo, tickers, premiums] = await Promise.all([
              binanceGet("/fapi/v1/exchangeInfo"),
              binanceGet("/fapi/v1/ticker/24hr"),
              binanceGet("/fapi/v1/premiumIndex"),
            ]);

            // Step A: build lookup maps
            const tradingSymbols = new Set(
              exchangeInfo.symbols
                .filter(s =>
                  s.contractType === "PERPETUAL" &&
                  s.status === "TRADING" &&
                  s.symbol.endsWith("USDT")
                )
                .map(s => s.symbol)
            );

            const tickerMap  = new Map(tickers.map(t => [t.symbol, t]));
            const fundingMap = new Map(premiums.map(p => [p.symbol, p]));

            // Step B: volume-filter first — eliminates most symbols before hitting OI endpoint
            const volFiltered = [];
            for (const symbol of tradingSymbols) {
              const t = tickerMap.get(symbol);
              const f = fundingMap.get(symbol);
              if (!t || !f) continue;
              const volUsd = parseFloat(t.quoteVolume || "0");
              if (volUsd < CFG.minVolUsd) continue;
              volFiltered.push({
                symbol,
                volUsd,
                fundingRate:     parseFloat(f.lastFundingRate   || "0"),
                priceChangePct:  parseFloat(t.priceChangePercent || "0"),
                lastPrice:       parseFloat(t.lastPrice          || "0"),
              });
            }
            console.log(`[scan] ${volFiltered.length} symbols passed volume filter (>${CFG.minVolUsd.toLocaleString()} USD)`);

            // Step C: concurrent OI fetch
            const oiResults = await mapConcurrent(volFiltered, CFG.concurrency, async (c) => {
              const oiData = await binanceGet("/fapi/v1/openInterest", { symbol: c.symbol });
              return { symbol: c.symbol, oi: parseFloat(oiData.openInterest || "0") };
            });

            const nowOI = {};
            const scored = [];
            for (let i = 0; i < volFiltered.length; i++) {
              const oiRes = oiResults[i];
              if (!oiRes || oiRes.__error) continue;
              const c = volFiltered[i];
              nowOI[oiRes.symbol] = oiRes.oi;
              const oiPrev = state.lastOI?.[oiRes.symbol] ?? oiRes.oi;
              const oiDeltaPct = oiPrev === 0
                ? 0
                : ((oiRes.oi - oiPrev) / oiPrev) * 100;
              scored.push({ ...c, oiDeltaPct });
            }

            // Step D: pre-shortlist — rank by funding + OI magnitude before fetching klines
            const preShortlist = scored
              .sort((a, b) =>
                (Math.abs(b.fundingRate) * CFG.wFunding + Math.abs(b.oiDeltaPct) * CFG.wOI) -
                (Math.abs(a.fundingRate) * CFG.wFunding + Math.abs(a.oiDeltaPct) * CFG.wOI)
              )
              .slice(0, CFG.topNRefined * 3); // 3× budget; trim to topNRefined after volatility
            console.log(`[scan] fetching klines for ${preShortlist.length} pre-shortlisted symbols...`);

            // Step E: concurrent klines -> volatility (sigma of log-returns, 5m bars, 2h lookback)
            const klineResults = await mapConcurrent(preShortlist, CFG.concurrency, async (c) => {
              const klines = await binanceGet("/fapi/v1/klines", {
                symbol: c.symbol,
                interval: "5m",
                limit: 24,
              });
              const closes = klines.map(k => parseFloat(k[4]));
              if (closes.length < 2) return 0.003;
              const rets = [];
              for (let i = 1; i < closes.length; i++) {
                rets.push(Math.log(closes[i] / closes[i - 1]));
              }
              const mean     = rets.reduce((a, b) => a + b, 0) / rets.length;
              const variance = rets.reduce((a, b) => a + (b - mean) ** 2, 0) / rets.length;
              return Math.sqrt(variance);
            });

            for (let i = 0; i < preShortlist.length; i++) {
              const sig = klineResults[i];
              preShortlist[i].sigmaPer5m = (!sig || preShortlist[i].__error || sig.__error)
                ? 0.003
                : sig;
            }

            // Step F: normalise volume + volatility, compute golden score, rank
            const maxVol  = Math.max(...preShortlist.map(c => c.volUsd), 1);
            const maxSig  = Math.max(...preShortlist.map(c => c.sigmaPer5m), 1e-6);

            for (const c of preShortlist) {
              c.goldenScore =
                CFG.wFunding * Math.abs(c.fundingRate) * 1000 +
                CFG.wOI     * Math.abs(c.oiDeltaPct)  / 10  +
                CFG.wVol    * (c.volUsd      / maxVol)       +
                CFG.wVolat  * (c.sigmaPer5m  / maxSig);
              c.candidateType = c.priceChangePct >= 0 ? "gainer" : "loser";
            }

            preShortlist.sort((a, b) => b.goldenScore - a.goldenScore);
            const candidates = preShortlist.slice(0, CFG.topNRefined);

            console.log(`[scan] top ${candidates.length} candidates selected by golden score`);
            candidates.forEach((c, i) =>
              console.log(
                `  [${i + 1}] ${c.symbol.padEnd(12)} ` +
                `score=${c.goldenScore.toFixed(4)} ` +
                `funding=${(c.fundingRate * 100).toFixed(4)}% ` +
                `oi_delta=${c.oiDeltaPct.toFixed(2)}% ` +
                `type=${c.candidateType}`
              )
            );

            return { candidates, nowOI };
          }

          // ----------------------------------------------------------------
          //  PHASE 2 — EXECUTION-QUALITY GATE  (enforced — was dead code in Code A)
          //
          //  Checks:
          //    • spread_bps  <= MAX_SPREAD_BPS
          //    • worst_slippage_bps (buy + sell, depth-based) <= MAX_SLIPPAGE_BPS
          //    • returns OBI (order-book imbalance) for metadata only, not gating
          // ----------------------------------------------------------------
          async function orderbookQuality(symbol) {
            const ob = await binanceGet("/fapi/v1/depth", { symbol, limit: 50 });
            const bids = (ob.bids || []).map(([p, q]) => [parseFloat(p), parseFloat(q)]);
            const asks = (ob.asks || []).map(([p, q]) => [parseFloat(p), parseFloat(q)]);
            if (!bids.length || !asks.length) return null;

            const bestBid = bids[0][0];
            const bestAsk = asks[0][0];
            const mid     = (bestBid + bestAsk) / 2;
            const spreadBps = ((bestAsk - bestBid) / mid) * 10000;

            // order-book imbalance from top N levels
            const topBids = bids.slice(0, CFG.obiTopN);
            const topAsks = asks.slice(0, CFG.obiTopN);
            const bidVol  = topBids.reduce((s, [, q]) => s + q, 0);
            const askVol  = topAsks.reduce((s, [, q]) => s + q, 0);
            const obi     = (bidVol - askVol) / Math.max(bidVol + askVol, 1e-9);

            // depth-based slippage for a notional CFG.depthUsdCheck USD order
            function slippageForSide(levels, usdTarget) {
              let remaining = usdTarget, notional = 0, filled = 0;
              for (const [price, qty] of levels) {
                const levelUsd = price * qty;
                const take     = Math.min(remaining, levelUsd);
                notional  += take;
                filled    += take / price;
                remaining -= take;
                if (remaining <= 0) break;
              }
              if (filled === 0) return Infinity;
              const avgPrice = notional / filled;
              return Math.abs((avgPrice - mid) / mid) * 10000;
            }

            const slippageBuyBps  = slippageForSide(asks, CFG.depthUsdCheck);
            const slippageSellBps = slippageForSide(bids, CFG.depthUsdCheck);
            const worstSlippageBps = Math.max(slippageBuyBps, slippageSellBps);

            return { spreadBps, obi, worstSlippageBps, mid };
          }

          function passesExecutionGate(q) {
            if (!q) return false;
            if (q.spreadBps      > CFG.maxSpreadBps)   return false;
            if (q.worstSlippageBps > CFG.maxSlippageBps) return false;
            return true;
          }

          // ----------------------------------------------------------------
          //  PHASE 3 — SIDE SELECTION
          //
          //  Three signals, weighted:
          //    40% price trend (momentum)
          //    30% funding fade (crowded longs pay funding -> fade longs)
          //    30% OI confirmation (OI expanding in trend direction)
          // ----------------------------------------------------------------
          function selectSide(c) {
            const trendSign   = Math.sign(c.priceChangePct);
            const fundingSign = -Math.sign(c.fundingRate); // fade the crowded side
            const oiSign      = (Math.sign(c.oiDeltaPct) * trendSign >= 0) ? trendSign : 0;

            const directionScore = trendSign * 0.4 + fundingSign * 0.3 + oiSign * 0.3;
            const side = directionScore >= 0 ? "long" : "short";

            console.log(
              `[side] ${c.symbol}: trend=${trendSign} funding_fade=${fundingSign} oi=${oiSign} ` +
              `score=${directionScore.toFixed(3)} -> ${side}`
            );
            return side;
          }

          // ----------------------------------------------------------------
          //  PHASE 4 — MONTE CARLO LIQUIDATION + 2x-PROFIT MODEL
          //
          //  Runs CFG.mcSims GBM paths over CFG.mcHorizonMin minutes.
          //  Returns:
          //    liqProb      — fraction of paths that hit liquidation distance first
          //    profit2xProb — fraction of paths that hit target profit first
          //
          //  NOTE: liquidation distance = 1/leverage (flat approximation).
          //  Maintenance margin tiers are intentionally not modelled here;
          //  treat liqProb as directional risk signal, not a precise figure.
          // ----------------------------------------------------------------
          function monteCarloRisk(entryPrice, side, sigmaPer5m, leverage, horizonMin, targetMult, sims) {
            const steps         = Math.max(1, Math.round(horizonMin / 5));
            const liqMovePct    = 1 / leverage;
            const targetMovePct = (targetMult - 1) / leverage;

            let liqHits = 0, profitHits = 0;

            for (let s = 0; s < sims; s++) {
              let price = entryPrice;
              let liquidated = false, profited = false;

              for (let i = 0; i < steps; i++) {
                // Irwin-Hall approximation of standard normal (mean=0, var≈1)
                const z = (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
                price  *= Math.exp(sigmaPer5m * z);

                const movePct = side === "long"
                  ? (price - entryPrice) / entryPrice
                  : (entryPrice - price) / entryPrice;

                if (movePct <= -liqMovePct)    { liquidated = true; break; }
                if (movePct >=  targetMovePct) { profited   = true; break; }
              }
              if (liquidated) liqHits++;
              else if (profited) profitHits++;
            }

            return {
              liqProb:      liqHits    / sims,
              profit2xProb: profitHits / sims,
            };
          }

          // ----------------------------------------------------------------
          //  PHASE 5 — SHARED VALIDATION WAIT  (parallelised)
          //
          //  Sleep ONCE for the whole batch, then re-check all candidates
          //  concurrently. A candidate passes if:
          //    • spread is still within gate after the wait
          //    • price moved in the expected direction (or didn't move at all)
          // ----------------------------------------------------------------
          async function validateAll(pending) {
            if (pending.length === 0) return [];
            console.log(`[validate] waiting ${CFG.validationWaitSec}s for ${pending.length} candidate(s)...`);
            await sleep(CFG.validationWaitSec * 1000); // ONE shared wait

            return mapConcurrent(pending, CFG.concurrency, async (p) => {
              try {
                const q = await orderbookQuality(p.symbol);
                if (!q) return { ...p, ok: false, q: null };

                const stillGoodSpread = q.spreadBps <= CFG.maxSpreadBps;
                const moveSign        = Math.sign(q.mid - p.entryPrice);
                const expectedSign    = p.side === "long" ? 1 : -1;
                const thesisHolds     = moveSign === 0 || moveSign === expectedSign;
                const ok              = stillGoodSpread && thesisHolds;

                console.log(
                  `[validate] ${p.symbol} ${p.side}: ` +
                  `spread_ok=${stillGoodSpread} thesis_ok=${thesisHolds} -> ${ok ? "PASS" : "FAIL"}`
                );
                return { ...p, ok, q };
              } catch (e) {
                console.error(`[validate] ${p.symbol} error:`, e.message);
                return { ...p, ok: false, q: null };
              }
            });
          }

          // ----------------------------------------------------------------
          //  PUSH — fire-and-forget to both worker endpoints with retry
          // ----------------------------------------------------------------
          async function pushIdeas(ideas) {
            if (ideas.length === 0) {
              console.log("[push] no ideas to push");
              return;
            }
            const payload = { ideas, generated_at: Date.now() };
            const urls    = [PUSH_URL, PUSH_URL_V2].filter(Boolean);
            if (urls.length === 0) {
              console.warn("[push] no push URLs configured — skipping");
              return;
            }
            await Promise.all(
              urls.map(url =>
                fetchWithRetry(url, {
                  method:  "POST",
                  headers: { "Content-Type": "application/json" },
                  body:    JSON.stringify(payload),
                })
                  .then(() => console.log(`[push] OK -> ${url}`))
                  .catch(e  => console.error(`[push] FAILED -> ${url}:`, e.message))
              )
            );
          }

          // ----------------------------------------------------------------
          //  MAIN
          // ----------------------------------------------------------------
          async function main() {
            console.log("=== Fusion Ultimate 1.0.1 start ===");
            const now = Date.now();

            // --- load state ---
            const state = await loadState();
            state.cooldowns  = state.cooldowns  || {};
            state.lastOI     = state.lastOI     || {};
            state.calibration = state.calibration || { total: 0, correct: 0 };

            // --- PHASE 1: universe scan ---
            const { candidates, nowOI } = await scanUniverse(state);

            // --- FIX 4: checkpoint OI immediately (before slow validation) ---
            // If the job times out during validation, the next run still has
            // fresh OI deltas to work with instead of stale data.
            state.lastOI = nowOI;
            await saveState(state).catch(e =>
              console.error("[checkpoint] OI save failed (non-fatal):", e.message)
            );

            // --- PHASE A: concurrent pre-screening (orderbook + MC, no sleep) ---
            console.log("[screen] running execution gate + Monte Carlo on all candidates...");
            const screenResults = await mapConcurrent(candidates, CFG.concurrency, async (c) => {
              // cooldown check
              if (now < (state.cooldowns[c.symbol] || 0)) {
                console.log(`[screen] ${c.symbol}: SKIPPED (cooldown)`);
                return null;
              }
              // orderbook quality gate
              const q = await orderbookQuality(c.symbol).catch(() => null);
              if (!passesExecutionGate(q)) {
                console.log(
                  `[screen] ${c.symbol}: FAIL execution gate ` +
                  `(spread=${q?.spreadBps?.toFixed(1) ?? "N/A"} slip=${q?.worstSlippageBps?.toFixed(1) ?? "N/A"})`
                );
                return null;
              }
              // side selection
              const side = selectSide(c);
              const entryPrice = q.mid;
              // Monte Carlo risk
              const risk = monteCarloRisk(
                entryPrice, side,
                c.sigmaPer5m,
                CFG.leverage,
                CFG.mcHorizonMin,
                CFG.targetProfitMult,
                CFG.mcSims
              );
              if (risk.liqProb > CFG.maxLiqProb) {
                console.log(
                  `[screen] ${c.symbol}: FAIL risk gate ` +
                  `(liq_prob=${risk.liqProb.toFixed(3)} > max=${CFG.maxLiqProb})`
                );
                return null;
              }
              console.log(
                `[screen] ${c.symbol}: PASS ` +
                `(side=${side} liq=${risk.liqProb.toFixed(3)} p2x=${risk.profit2xProb.toFixed(3)})`
              );
              return { c, side, entryPrice, risk, q };
            });

            const pending = screenResults.filter(s => s && !s.__error);
            console.log(`[screen] ${pending.length}/${candidates.length} passed to validation`);

            // --- PHASE B: single shared validation wait, all candidates parallel ---
            const validated = await validateAll(pending);

            // --- PHASE C: build ideas, apply hedge if enabled, update cooldowns ---
            const ideas = [];

            for (const v of validated) {
              if (!v || !v.ok) continue;
              const { c, side, entryPrice, risk, q } = v;

              const baseConf  = risk.profit2xProb * (1 - risk.liqProb);
              const confidence = calibratedConfidence(baseConf, state.calibration);

              const baseIdea = {
                symbol:      c.symbol,
                side,
                entry_price: entryPrice,
                leverage:    CFG.leverage,
                confidence,
                hedge_metrics: {
                  funding_rate:         c.fundingRate,
                  oi_delta_pct:         c.oiDeltaPct,
                  volume_usd:           c.volUsd,
                  volatility_sigma_5m:  c.sigmaPer5m,
                  golden_score:         c.goldenScore,
                  spread_bps:           q.spreadBps,
                  obi:                  q.obi,
                  worst_slippage_bps:   q.worstSlippageBps,
                  liq_prob:             risk.liqProb,
                  profit2x_prob:        risk.profit2xProb,
                  candidate_type:       c.candidateType,
                  preferred_side:       side,
                  hedge_enabled:        CFG.hedge,
                  validated:            true,
                },
                ttl_min:    CFG.ideaTtlMin,
                created_at: now,
              };
              ideas.push(baseIdea);

              // hedge: evaluate the opposite side independently through the SAME
              // MC + execution gate — never force-add it just because primary passed
              if (CFG.hedge) {
                const oppSide = side === "long" ? "short" : "long";
                const oppRisk = monteCarloRisk(
                  entryPrice, oppSide,
                  c.sigmaPer5m,
                  CFG.leverage,
                  CFG.mcHorizonMin,
                  CFG.targetProfitMult,
                  CFG.mcSims
                );
                if (oppRisk.liqProb <= CFG.maxLiqProb) {
                  const oppBase = oppRisk.profit2xProb * (1 - oppRisk.liqProb);
                  ideas.push({
                    ...baseIdea,
                    side:       oppSide,
                    confidence: calibratedConfidence(oppBase, state.calibration),
                    hedge_metrics: {
                      ...baseIdea.hedge_metrics,
                      preferred_side:  oppSide,
                      liq_prob:        oppRisk.liqProb,
                      profit2x_prob:   oppRisk.profit2xProb,
                      hedge_enabled:   true,
                    },
                  });
                  console.log(
                    `[hedge] ${c.symbol} ${oppSide} added ` +
                    `(liq=${oppRisk.liqProb.toFixed(3)} p2x=${oppRisk.profit2xProb.toFixed(3)})`
                  );
                } else {
                  console.log(
                    `[hedge] ${c.symbol} ${oppSide} REJECTED ` +
                    `(liq_prob=${oppRisk.liqProb.toFixed(3)} > max=${CFG.maxLiqProb})`
                  );
                }
              }

              // set cooldown for this symbol regardless of hedge outcome
              state.cooldowns[c.symbol] = now + CFG.cooldownMin * 60 * 1000;
            }

            // --- push ---
            await pushIdeas(ideas);

            // --- final state save (cooldowns updated) ---
            await saveState(state);

            console.log(
              `=== Fusion Ultimate done: ` +
              `scanned=${candidates.length} ` +
              `screened=${pending.length} ` +
              `validated=${validated.filter(v => v?.ok).length} ` +
              `pushed=${ideas.length} ===`
            );
          }

          main().catch(err => {
            console.error("FATAL:", err);
            process.exit(1);
          });

          JSEOF

      - name: Run engine
        run: node fusion.js
