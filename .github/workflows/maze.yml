          }

          function predictPrice5Min(mtfData, currentPrice) {
            const makePrediction = (candles, weight) => {
              const closes = candles.slice(-20).map(c => parseFloat(c[4]));
              const n = closes.length, mx = (n-1)/2;
              let num=0, den=0;
              for (let i=0; i<n; i++) { const x=i-mx, y=closes[i]; num+=x*y; den+=x*x; }
              const slope = den>0 ? num/den : 0;
              return { prediction: closes[n-1] + slope, weight };
            };
            const pred5m  = makePrediction(mtfData.k5m,  0.50);
            const pred15m = makePrediction(mtfData.k15m, 0.30);
            const pred1h  = makePrediction(mtfData.k1h,  0.20);
            const weightedPrediction = pred5m.prediction*pred5m.weight + pred15m.prediction*pred15m.weight + pred1h.prediction*pred1h.weight;
            return { predicted_price:+weightedPrediction.toFixed(2), change_pct:+((weightedPrediction-currentPrice)/currentPrice*100).toFixed(3), components:{ tf_5m:+pred5m.prediction.toFixed(2), tf_15m:+pred15m.prediction.toFixed(2), tf_1h:+pred1h.prediction.toFixed(2) } };
          }

          async function fetchBinanceOrderbook(symbol) {
            const cacheKey = `binance_depth_${symbol}`;
            const cached = getCached(cache.binance, cacheKey, 5000);
            if (cached) return cached;
            try {
              // Valid Binance depth limits: 5 10 20 50 100 500 1000
              const validLimit = [5,10,20,50,100,500,1000].find(l => l >= DEPTH_LIMIT) || 20;
              const url = `${BINANCE_API}/fapi/v1/depth?symbol=${symbol}&limit=${validLimit}`;
              const data = await getJSON(url, 8000, 2);
              if (!data?.bids || !data?.asks) return null;
              // Binance format: { lastUpdateId, bids:[[price,qty],...], asks:[[price,qty],...] }
              const normalized = { bids: data.bids, asks: data.asks, ts: Date.now() };
              setCached(cache.binance, cacheKey, normalized);
              return normalized;
            } catch (e) { return null; }
          }

