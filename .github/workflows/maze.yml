      - name: Run Simple Entry/Exit Analyzer
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WORKER_URL:-}" ]]; then
            echo "[analyzer] Missing WORKER_URL"; exit 1
          fi
          if [[ -z "${ANALYSIS_GIST_ID:-}" || -z "${GIST_TOKEN:-}" ]]; then
            echo "[analyzer] Missing ANALYSIS_GIST_ID or GIST_TOKEN"; exit 1
          fi

          set +e
          node - <<'NODE'
          (async () => {
          'use strict';
          const crypto = require('crypto');
          const VERSION = '3.1.0';
          const UA = `trend-analyzer/${VERSION}`;
          const log = (...a) => console.log('[analyzer]', ...a);

          // ================================================================
          //  CONFIGURATION
          // ================================================================
          const WORKER_URL = (process.env.WORKER_URL || '').replace(/\/+$/, '');
          const WORKER_URL_2 = (process.env.WORKER_URL_2 || '').replace(/\/+$/, '');
          const ANALYSIS_GIST_ID = process.env.ANALYSIS_GIST_ID || '';
          const GIST_TOKEN = process.env.GIST_TOKEN || '';
          const PUSH_URL = process.env.WORKER_PUSH_URL || '';
          const PUSH_TOKEN = process.env.PUSH_TOKEN || '';
          const TOP_N = Math.max(1, Math.min(10, Number(process.env.TOP_N || '3')));
          const MAX_SL_BPS = Math.max(10, Math.min(300, Number(process.env.MAX_SL_BPS || '80')));
          const TP_BPS_CFG = Math.max(10, Number(process.env.TP_BPS || '100'));
          const SL_BPS_CFG = Math.max(10, Number(process.env.SL_BPS || '50'));
          const NOTIONAL = Math.max(50, Number(process.env.NOTIONAL_USD || '300'));
          const BYBIT_PUBLIC = (process.env.BYBIT_PROXY_URL || 'https://api.bybit.com').replace(/\/+$/, '');
          const MIN_MOVE_BPS = Math.max(0, Number(process.env.MIN_MOVE_BPS || '5'));
          const CONFIRM_PATH = process.env.WORKER_CONFIRM_PATH || '/json';
          const CONFIRM_TRIES = 4;
          const CONFIRM_DELAY_MS = 2500;
          const MAX_AGE_H = 72;
          const TTL_SEC = 3600;

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;

          // ================================================================
          //  HTTP HELPERS
          // ================================================================
          async function fetchJSON(url, ms = 15000) {
            const ac = new AbortController();
            const t = setTimeout(() => ac.abort(), ms);
            try {
              const r = await fetch(url, { signal: ac.signal, headers: { 'User-Agent': UA } });
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return await r.json();
            } finally { clearTimeout(t); }
          }

          async function fetchRetry(url, tries = 3, delayMs = 600) {
            for (let i = 0; i < tries; i++) {
              try { return await fetchJSON(url); }
              catch (e) {
                if (i === tries - 1) throw e;
                await sleep(delayMs * (i + 1));
              }
            }
          }

          // ================================================================
          //  GIST I/O
          // ================================================================
          async function readAnalysisGist() {
            try {
              const r = await fetch(`https://api.github.com/gists/${ANALYSIS_GIST_ID}`, {
                headers: {
                  Authorization: `Bearer ${GIST_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'User-Agent': UA
                }
              });
              if (!r.ok) return {};
              const g = await r.json();
              const c = g.files?.['trend_analysis.json']?.content;
              return c ? JSON.parse(c) : {};
            } catch (e) {
              log('readGist warn:', e?.message);
              return {};
            }
          }

          async function writeAnalysisGist(data) {
            try {
              const r = await fetch(`https://api.github.com/gists/${ANALYSIS_GIST_ID}`, {
                method: 'PATCH',
                headers: {
                  Authorization: `Bearer ${GIST_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': UA
                },
                body: JSON.stringify({
                  files: { 'trend_analysis.json': { content: JSON.stringify(data, null, 2) } }
                })
              });
              log('writeGist status:', r.status);
              if (!r.ok) process.exitCode = 1;
            } catch (e) {
              log('writeGist error:', e?.message);
              process.exitCode = 1;
            }
          }

          // ================================================================
          //  BYBIT TICKER
          // ================================================================
          async function getBybitTicker(symbol) {
            const url = `${BYBIT_PUBLIC}/v5/market/tickers?category=linear&symbol=${symbol}`;
            try {
              const data = await fetchRetry(url, 2, 300);
              const t = data?.result?.list?.[0];
              if (!t) return null;
              return {
                symbol: t.symbol,
                lastPrice: +t.lastPrice,
                bid: +t.bid1Price,
                ask: +t.ask1Price,
                turnover24h: +t.turnover24h,
                fundingRate: +t.fundingRate,
                openInterest: +t.openInterest
              };
            } catch { return null; }
          }

          // ================================================================
          //  CORE: direction = compare current price vs last exit price
          // ================================================================
          function computeDirection(trades, currentPrice) {
            if (!trades.length) return {
              direction: 'neutral', reason: 'no_trades',
              lastExit: null, moveBps: 0
            };

            const lastExit = trades.at(-1).exitPrice;
            const moveBps = (currentPrice / lastExit - 1) * 10000;

            if (moveBps > MIN_MOVE_BPS) {
              return { direction: 'long', reason: 'price_above_last_exit', lastExit, moveBps };
            }
            if (moveBps < -MIN_MOVE_BPS) {
              return { direction: 'short', reason: 'price_below_last_exit', lastExit, moveBps };
            }
            return { direction: 'neutral', reason: 'too_close_to_last_exit', lastExit, moveBps };
          }

          // ================================================================
          //  NORMALIZE TRADES FROM A WORKER
          // ================================================================
          function normalizeWorker1Trades(pnlData) {
            const bySymbol = {};
            for (const t of pnlData) {
              if (!t.symbol) continue;
              const entryPrice = +t.entryPrice || +t.avgEntryPrice || 0;
              const exitPrice  = +t.exitPrice  || +t.avgExitPrice  || 0;
              const ms = v => (v > 0 && v < 1e11) ? v * 1000 : v;
              const closedAt   = ms(+t.closedAt || +t.updatedTime || 0);

              if (!(entryPrice > 0 && exitPrice > 0 && closedAt > 0)) continue;
              if (Date.now() - closedAt > MAX_AGE_H * 3600e3) continue;

              if (!bySymbol[t.symbol]) bySymbol[t.symbol] = [];
              bySymbol[t.symbol].push({ entryPrice, exitPrice, closedAt });
            }
            for (const sym of Object.keys(bySymbol)) {
              bySymbol[sym].sort((a, b) => a.closedAt - b.closedAt);
            }
            return bySymbol;
          }

          function normalizeWorker2Trades(pnlData2) {
            const bySymbol = {};
            for (const t of pnlData2) {
              if (!t.symbol) continue;
              const entryPrice = +t.entryPrice || 0;
              const exitPrice  = +t.exitPrice  || 0;
              const closedAt   = +t.time || 0;

              if (!(entryPrice > 0 && exitPrice > 0 && closedAt > 0)) continue;
              if (Date.now() - closedAt > MAX_AGE_H * 3600e3) continue;

              if (!bySymbol[t.symbol]) bySymbol[t.symbol] = [];
              bySymbol[t.symbol].push({ entryPrice, exitPrice, closedAt });
            }
            for (const sym of Object.keys(bySymbol)) {
              bySymbol[sym].sort((a, b) => a.closedAt - b.closedAt);
            }
            return bySymbol;
          }

          // ================================================================
          //  PUSH CONFIRMATION — poll worker and look for the idea
          // ================================================================
          function deepContainsValue(obj, needle, depth = 0) {
            if (depth > 6 || obj == null) return false;
            if (typeof obj === 'string') return obj.includes(needle);
            if (typeof obj === 'number') return String(obj) === needle;
            if (Array.isArray(obj)) return obj.some(v => deepContainsValue(v, needle, depth + 1));
            if (typeof obj === 'object') {
              return Object.values(obj).some(v => deepContainsValue(v, needle, depth + 1));
            }
            return false;
          }

          function findIdeaMatch(stateJson, idea) {
            // Try matching by client_order_id / idea_id first (most reliable)
            if (idea.client_order_id && deepContainsValue(stateJson, idea.client_order_id)) {
              return 'client_order_id';
            }
            if (idea.idea_id && deepContainsValue(stateJson, idea.idea_id)) {
              return 'idea_id';
            }
            // Fallback: symbol present anywhere (weaker signal)
            if (idea.symbol_full && deepContainsValue(stateJson, idea.symbol_full)) {
              return 'symbol_fallback';
            }
            return null;
          }

          async function confirmPushedIdeas(pushedIdeasMeta) {
            const results = {};
            for (const idea of pushedIdeasMeta) results[idea.client_order_id] = { confirmed: false, matchType: null };

            const confirmUrl = `${WORKER_URL}${CONFIRM_PATH}`;
            for (let attempt = 1; attempt <= CONFIRM_TRIES; attempt++) {
              await sleep(CONFIRM_DELAY_MS);
              let stateJson;
              try {
                stateJson = await fetchJSON(confirmUrl, 10000);
              } catch (e) {
                log(`  confirm attempt ${attempt}/${CONFIRM_TRIES}: fetch failed (${e?.message})`);
                continue;
              }

              let allConfirmed = true;
              for (const idea of pushedIdeasMeta) {
                if (results[idea.client_order_id].confirmed) continue;
                const match = findIdeaMatch(stateJson, idea);
                if (match) {
                  results[idea.client_order_id] = { confirmed: true, matchType: match };
                } else {
                  allConfirmed = false;
                }
              }

              log(`  confirm attempt ${attempt}/${CONFIRM_TRIES}: `
                + `${Object.values(results).filter(r => r.confirmed).length}/${pushedIdeasMeta.length} confirmed`);

              if (allConfirmed) break;
            }
            return results;
          }

          // ================================================================
          //  MAIN EXECUTION
          // ================================================================
          log('╔═══════════════════════════════════════════════╗');
          log('║  Simple Entry/Exit Analyzer v' + VERSION + '          ║');
          log('╚═══════════════════════════════════════════════╝');

          const prev = await readAnalysisGist();
          const pushedPrev = prev.pushed || {};

          // ---- STEP 1: Fetch trades from both workers ----
          log('');
          log('━━━ STEP 1: Fetch worker trades ━━━');

          let pnlData = [];
          let stateData = {};
          try {
            const raw = await fetchRetry(`${WORKER_URL}/pnl?limit=100`);
            pnlData = Array.isArray(raw) ? raw : (raw?.items || raw?.data || raw?.closedPnl || []);
          } catch (e) {
            log('FATAL: Cannot reach worker 1 /pnl:', e?.message);
            await writeAnalysisGist({
              ts: new Date().toISOString(), version: VERSION,
              status: 'worker_unreachable', error: e?.message, ideas: [], pushed: pushedPrev
            });
            process.exit(1);
          }

          try {
            stateData = await fetchRetry(`${WORKER_URL}/json`);
          } catch (e) {
            log('WARN: Cannot reach worker state /json:', e?.message);
          }

          let pnlData2 = [];
          if (WORKER_URL_2) {
            try {
              const raw2 = await fetchRetry(`${WORKER_URL_2}/pnl`);
              pnlData2 = Array.isArray(raw2?.trades) ? raw2.trades : [];
              log(`Worker 2: fetched ${pnlData2.length} closed trades`);
            } catch (e) {
              log('WARN: Worker 2 /pnl unreachable:', e?.message);
            }
          } else {
            log('Worker 2: not configured — both-agree check cannot run, aborting.');
          }

          if (!pnlData.length || !pnlData2.length) {
            log('Need closed trades from BOTH workers to agree. Writing empty analysis.');
            await writeAnalysisGist({
              ts: new Date().toISOString(), version: VERSION,
              status: 'insufficient_data', ideas: [], pushed: pushedPrev
            });
            process.exit(0);
          }

          const regime = stateData?.regime?.regime || 'Unknown';
          const positions = Array.isArray(stateData?.positions)
            ? stateData.positions.filter(p => !(+p.size === 0)) : [];
          const openSyms = new Set(positions.map(p => p.symbol));
          log(`Regime: ${regime} | Open positions: ${positions.length}`);

          // ---- STEP 2: Normalize + group by symbol per worker ----
          log('');
          log('━━━ STEP 2: Normalize trades per worker ━━━');
          const bySymbol1 = normalizeWorker1Trades(pnlData);
          const bySymbol2 = normalizeWorker2Trades(pnlData2);
          log(`Worker1 symbols: ${Object.keys(bySymbol1).join(', ') || '(none)'}`);
          log(`Worker2 symbols: ${Object.keys(bySymbol2).join(', ') || '(none)'}`);

          const commonSymbols = Object.keys(bySymbol1).filter(s => bySymbol2[s]);
          log(`Common symbols (both workers): ${commonSymbols.join(', ') || '(none)'}`);

          if (!commonSymbols.length) {
            log('No common symbols between workers. Writing empty analysis.');
            await writeAnalysisGist({
              ts: new Date().toISOString(), version: VERSION,
              status: 'no_common_symbols', ideas: [], pushed: pushedPrev
            });
            process.exit(0);
          }

          // ---- STEP 3: Fetch current prices ----
          log('');
          log('━━━ STEP 3: Fetch current prices ━━━');
          const tickers = {};
          for (const sym of commonSymbols) {
            tickers[sym] = await getBybitTicker(sym);
            await sleep(100);
            if (tickers[sym]) log(`  ${sym}: $${tickers[sym].lastPrice}`);
            else log(`  ${sym}: ticker fetch failed`);
          }

          // ---- STEP 4: Compute direction per worker, require agreement ----
          log('');
          log('━━━ STEP 4: Trend table (lastExit vs current) ━━━');

          const rows = [];
          const perSymbolDebug = {};
          const candidates = [];

          for (const sym of commonSymbols) {
            const ticker = tickers[sym];
            if (!ticker || !(ticker.lastPrice > 0)) continue;
            const currentPrice = ticker.lastPrice;

            const d1 = computeDirection(bySymbol1[sym], currentPrice);
            const d2 = computeDirection(bySymbol2[sym], currentPrice);

            const agree = (d1.direction !== 'neutral')
              && (d1.direction === d2.direction);

            rows.push({
              symbol: sym,
              w1LastExit: d1.lastExit,
              w2LastExit: d2.lastExit,
              current: currentPrice,
              w1Dir: d1.direction,
              w2Dir: d2.direction,
              agree
            });

            perSymbolDebug[sym] = {
              currentPrice,
              worker1: d1,
              worker2: d2,
              agree
            };

            if (!agree) continue;
            if (openSyms.has(sym)) continue;

            const score = (Math.abs(d1.moveBps) + Math.abs(d2.moveBps)) / 2;
            candidates.push({
              symbol: sym,
              side: d1.direction,
              score,
              currentPrice,
              ticker
            });
          }

          const arrow = d => d === 'long' ? '🔼 UP' : d === 'short' ? '🔽 DOWN' : '⏸ FLAT';
          log('');
          log('Symbol         | W1 LastExit  | W2 LastExit  | Current      | Trend(W1) | Trend(W2) | Agree?');
          log('---------------|--------------|--------------|--------------|-----------|-----------|-------');
          for (const r of rows) {
            const sym = r.symbol.padEnd(14);
            const w1e = (r.w1LastExit ?? '-').toString().padEnd(12);
            const w2e = (r.w2LastExit ?? '-').toString().padEnd(12);
            const cur = r.current.toString().padEnd(12);
            const t1 = arrow(r.w1Dir).padEnd(9);
            const t2 = arrow(r.w2Dir).padEnd(9);
            const ag = r.agree ? '✅' : '❌';
            log(`${sym} | ${w1e} | ${w2e} | ${cur} | ${t1} | ${t2} | ${ag}`);
          }

          // ---- STEP 5: Rank + build ideas (score system) ----
          log('');
          log('━━━ STEP 5: Score + rank candidates ━━━');
          candidates.sort((a, b) => b.score - a.score);
          for (const c of candidates) {
            log(`  ${c.symbol} ${c.side.toUpperCase()} score=${c.score.toFixed(1)}bps`);
          }
          const top = candidates.slice(0, TOP_N);

          const sl_bps = Math.min(SL_BPS_CFG, MAX_SL_BPS);
          const tp_bps = TP_BPS_CFG;

          const finalIdeas = top.map(c => {
            const entry = +c.currentPrice.toPrecision(7);
            let tp_abs, sl_abs;
            if (c.side === 'long') {
              tp_abs = +(entry * (1 + tp_bps / 10000)).toPrecision(7);
              sl_abs = +(entry * (1 - sl_bps / 10000)).toPrecision(7);
            } else {
              tp_abs = +(entry * (1 - tp_bps / 10000)).toPrecision(7);
              sl_abs = +(entry * (1 + sl_bps / 10000)).toPrecision(7);
            }
            const rrr = +(tp_bps / sl_bps).toFixed(2);
            return {
              symbol: c.symbol,
              base: c.symbol.replace('USDT', ''),
              quote: 'USDT',
              side: c.side,
              entry, tp_abs, sl_abs, tp_bps, sl_bps, rrr,
              score_bps: +c.score.toFixed(1),
              funding_rate: c.ticker?.fundingRate || 0,
              volume_24h: c.ticker?.turnover24h || 0,
              reasons: [
                `Both workers: current price ${c.side === 'long' ? 'above' : 'below'} last exit price`,
                `Score (avg move from last exit) = ${c.score.toFixed(1)}bps`
              ],
              generated_at: new Date().toISOString()
            };
          });

          log('');
          log(`Final ideas: ${finalIdeas.length}`);
          for (const i of finalIdeas) {
            log(`  ${i.symbol} ${i.side.toUpperCase()} entry=${i.entry} tp=${i.tp_abs} sl=${i.sl_abs} score=${i.score_bps}bps`);
          }

          // ---- STEP 6: Write analysis gist (pre-push) ----
          log('');
          log('━━━ STEP 6: Write analysis Gist ━━━');
          const pushedNext = {};
          for (const [k, ts] of Object.entries(pushedPrev)) {
            if (Date.now() - ts < 6 * 3600e3) pushedNext[k] = ts;
          }
          const pushIdeas = finalIdeas.filter(i => {
            const ts = pushedPrev[i.symbol + '|' + i.side];
            return !(ts && Date.now() - ts < TTL_SEC * 1000);
          });

          const output = {
            ts: new Date().toISOString(),
            version: VERSION,
            status: 'ok',
            worker_regime: regime,
            open_positions: positions.length,
            common_symbols: commonSymbols.length,
            candidates_found: candidates.length,
            trend_table: rows,
            ideas: finalIdeas,
            debug_per_symbol: perSymbolDebug,
            pushed: pushedNext,
            push_confirmation: {},
            config: { top_n: TOP_N, tp_bps, sl_bps, min_move_bps: MIN_MOVE_BPS, notional_usd: NOTIONAL }
          };
          await writeAnalysisGist(output);
          log('Analysis Gist written.');

          // ---- STEP 7: Push ideas to worker ----
          let pushedIdeaMeta = [];
          if (PUSH_URL && PUSH_TOKEN && pushIdeas.length > 0) {
            log('');
            log('━━━ STEP 7: Push ideas to worker ━━━');

            pushedIdeaMeta = pushIdeas.map((idea, i) => ({
              idea_id: crypto.randomUUID(),
              client_order_id: ('ta_' + crypto.randomUUID().replace(/-/g, '')).slice(0, 28),
              symbol: idea.base,
              symbol_full: idea.symbol,
              side: idea.side
            }));

            const pushPayload = {
              ts: new Date().toISOString(),
              mode: 'normal',
              source: 'simple_entry_exit_analyzer',
              meta: { origin: 'github_actions_analyzer', version: VERSION, worker_regime: regime },
              top_n: pushIdeas.length,
              ideas: pushIdeas.map((idea, i) => ({
                idea_id: pushedIdeaMeta[i].idea_id,
                client_order_id: pushedIdeaMeta[i].client_order_id,
                symbol: idea.base,
                symbol_full: idea.symbol,
                quote: idea.quote,
                side: idea.side,
                rank: i + 1,
                entry_policy: 'simple_market',
                entry_type: 'limit',
                entry_mid: idea.entry,
                entry_limit: idea.entry,
                tp_abs: idea.tp_abs,
                sl_abs: idea.sl_abs,
                tp_bps: idea.tp_bps,
                sl_bps: idea.sl_bps,
                rrr: idea.rrr,
                ttl_sec: TTL_SEC,
                reasons: idea.reasons.map(r => ({ factor: 'trend', value: r, contribution: 0 })),
                reasons_text: idea.reasons
              }))
            };

            let pushOk = false;
            try {
              const ac = new AbortController();
              const t = setTimeout(() => ac.abort(), 15000);
              const r = await fetch(PUSH_URL, {
                method: 'POST',
                signal: ac.signal,
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${PUSH_TOKEN}`,
                  'User-Agent': UA
                },
                body: JSON.stringify(pushPayload)
              });
              clearTimeout(t);
              let txt = '';
              try { txt = await r.text(); } catch {}
              log('Push status:', r.status, (txt || '').slice(0, 300));
              pushOk = r.ok;
            } catch (e) {
              log('Push failed:', e?.message);
            }

            // ---- STEP 8: Confirm the worker actually received the ideas ----
            if (pushOk) {
              log('');
              log('━━━ STEP 8: Confirm push received by worker ━━━');
              log(`Polling ${WORKER_URL}${CONFIRM_PATH} up to ${CONFIRM_TRIES}x (every ${CONFIRM_DELAY_MS}ms)...`);

              const confirmResults = await confirmPushedIdeas(pushedIdeaMeta);
              const confirmBySymbolSide = {};

              for (const meta of pushedIdeaMeta) {
                const res = confirmResults[meta.client_order_id];
                const key = `${meta.symbol_full}|${meta.side}`;
                confirmBySymbolSide[key] = res;
                if (res.confirmed) {
                  log(`  ✅ ${meta.symbol_full} ${meta.side.toUpperCase()} CONFIRMED (matched by ${res.matchType})`);
                } else {
                  log(`  ❌ ${meta.symbol_full} ${meta.side.toUpperCase()} NOT CONFIRMED after ${CONFIRM_TRIES} attempts`);
                }
              }

              // Only mark as "pushed" (cooldown) the ones that were actually confirmed
              for (const i of pushIdeas) {
                const key = `${i.symbol}|${i.side}`;
                if (confirmBySymbolSide[key]?.confirmed) {
                  pushedNext[key] = Date.now();
                }
              }

              output.pushed = pushedNext;
              output.push_confirmation = confirmBySymbolSide;
              await writeAnalysisGist(output);

              const confirmedCount = Object.values(confirmBySymbolSide).filter(r => r.confirmed).length;
              log(`Confirmation summary: ${confirmedCount}/${pushedIdeaMeta.length} ideas confirmed received.`);
            } else {
              log('Skipping confirmation step — push itself failed.');
            }
          } else if (pushIdeas.length === 0) {
            log('');
            log('No new ideas to push.');
          } else {
            log('');
            log('Push skipped (no WORKER_PUSH_URL or PUSH_TOKEN).');
          }

          log('');
          log('═══ Analysis complete ═══');
          })().catch(e => { console.error('[analyzer] FATAL', e); process.exit(1); });
          NODE

          EXIT_CODE=$?
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "[analyzer] Node exited with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
