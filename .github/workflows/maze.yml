name: Trend Analyzer (Simple Entry/Exit v4.2)
on:
  repository_dispatch:
    types: [run_X]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: trend-analyzer
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_URL_2: ${{ secrets.WORKER_URL_2 }}
      ANALYSIS_GIST_ID: ${{ secrets.ANALYSIS_GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      BYBIT_PROXY_URL: ${{ secrets.BYBIT_PROXY_URL }}
      WORKER_PUSH_URL: ${{ secrets.WORKER_PUSH_URL }}
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
      TOP_N: ${{ vars.ANALYZER_TOP_N }}
      MAX_SL_BPS: ${{ vars.ANALYZER_MAX_SL_BPS }}
      TP_BPS: ${{ vars.ANALYZER_TP_BPS }}
      SL_BPS: ${{ vars.ANALYZER_SL_BPS }}
      NOTIONAL_USD: ${{ vars.NOTIONAL_USD }}
      MIN_MOVE_BPS: ${{ vars.ANALYZER_MIN_MOVE_BPS }}
      # New variables accept both the ANALYZER_ name and the plain name
      WATCH_MIN: ${{ vars.ANALYZER_WATCH_MIN || vars.WATCH_MIN }}
      ARTIFICIAL_SL_PCT: ${{ vars.ANALYZER_ARTIFICIAL_SL_PCT || vars.ARTIFICIAL_SL_PCT }}
      WATCH_POOL: ${{ vars.ANALYZER_WATCH_POOL || vars.WATCH_POOL }}
      PNL_LIMIT: ${{ vars.ANALYZER_PNL_LIMIT || vars.PNL_LIMIT }}
      WORKER_MODE: ${{ vars.ANALYZER_WORKER_MODE || vars.WORKER_MODE }}
    steps:
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Simple Entry/Exit Analyzer
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WORKER_URL:-}" ]]; then
            echo "[analyzer] Missing WORKER_URL"; exit 1
          fi
          if [[ -z "${ANALYSIS_GIST_ID:-}" || -z "${GIST_TOKEN:-}" ]]; then
            echo "[analyzer] Missing ANALYSIS_GIST_ID or GIST_TOKEN"; exit 1
          fi
          set +e
          node - <<'NODE'
          (async () => {
          'use strict';
          const crypto = require('crypto');
          const VERSION = '4.3.0';
          const UA = `trend-analyzer/${VERSION}`;
          const log = (...a) => console.log('[analyzer]', ...a);
          // ================================================================
          //  CONFIGURATION
          // ================================================================
          const WORKER_URL = (process.env.WORKER_URL || '').replace(/\/+$/, '');
          const WORKER_URL_2 = (process.env.WORKER_URL_2 || '').replace(/\/+$/, '');
          const ANALYSIS_GIST_ID = process.env.ANALYSIS_GIST_ID || '';
          const GIST_TOKEN = process.env.GIST_TOKEN || '';
          const PUSH_URL = process.env.WORKER_PUSH_URL || '';
          const PUSH_TOKEN = process.env.PUSH_TOKEN || '';
          const TOP_N = Math.max(1, Math.min(10, Number(process.env.TOP_N || '3')));
          const MAX_SL_BPS = Math.max(10, Math.min(300, Number(process.env.MAX_SL_BPS || '80')));
          const TP_BPS_CFG = Math.max(10, Number(process.env.TP_BPS || '100'));
          const SL_BPS_CFG = Math.max(10, Number(process.env.SL_BPS || '50'));
          const NOTIONAL = Math.max(50, Number(process.env.NOTIONAL_USD || '300'));
          const BYBIT_PUBLIC = (process.env.BYBIT_PROXY_URL || 'https://api.bybit.com').replace(/\/+$/, '');
          const MIN_MOVE_BPS = Math.max(0, Number(process.env.MIN_MOVE_BPS || '5'));
          // --- Watch phase ---
          const WATCH_MIN = Math.max(0, Math.min(15, Number(process.env.WATCH_MIN || '3')));
          const ARTIFICIAL_SL_PCT = Math.max(0.01, Math.min(5, Number(process.env.ARTIFICIAL_SL_PCT || '0.3')));
          const WATCH_POOL = Math.max(TOP_N, Math.min(30, Number(process.env.WATCH_POOL || '10')));
          const POLL_MS = 10000;
          // --- Full history request size ---
          const PNL_LIMIT = Math.max(100, Number(process.env.PNL_LIMIT || '1000'));
          // --- Worker mode: '1' | '2' | 'both' (default 'both') ---
          const WORKER_MODE_RAW = String(process.env.WORKER_MODE || '').trim().toLowerCase();
          const WORKER_MODE = ['1', '2', 'both'].includes(WORKER_MODE_RAW) ? WORKER_MODE_RAW : 'both';
          const USE_W1 = WORKER_MODE === '1' || WORKER_MODE === 'both';   // fetch worker 1 trades
          const USE_W2 = WORKER_MODE === '2' || WORKER_MODE === 'both';   // fetch worker 2 trades
          // --- Cooldown: 5 minutes (also sent to worker as idea ttl_sec) ---
          const TTL_SEC = 300;
          const PUSHED_KEEP_MS = Math.max(30 * 60e3, TTL_SEC * 1000 * 2);
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          // ================================================================
          //  HTTP HELPERS
          // ================================================================
          async function fetchJSON(url, ms = 15000) {
            const ac = new AbortController();
            const t = setTimeout(() => ac.abort(), ms);
            try {
              const r = await fetch(url, { signal: ac.signal, headers: { 'User-Agent': UA } });
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return await r.json();
            } finally { clearTimeout(t); }
          }
          async function fetchRetry(url, tries = 3, delayMs = 600) {
            for (let i = 0; i < tries; i++) {
              try { return await fetchJSON(url); }
              catch (e) {
                if (i === tries - 1) throw e;
                await sleep(delayMs * (i + 1));
              }
            }
          }
          // ================================================================
          //  GIST I/O
          // ================================================================
          async function readAnalysisGist() {
            try {
              const r = await fetch(`https://api.github.com/gists/${ANALYSIS_GIST_ID}`, {
                headers: {
                  Authorization: `Bearer ${GIST_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'User-Agent': UA
                }
              });
              if (!r.ok) return {};
              const g = await r.json();
              const c = g.files?.['trend_analysis.json']?.content;
              return c ? JSON.parse(c) : {};
            } catch (e) {
              log('readGist warn:', e?.message);
              return {};
            }
          }
          async function writeAnalysisGist(data) {
            try {
              const r = await fetch(`https://api.github.com/gists/${ANALYSIS_GIST_ID}`, {
                method: 'PATCH',
                headers: {
                  Authorization: `Bearer ${GIST_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': UA
                },
                body: JSON.stringify({
                  files: { 'trend_analysis.json': { content: JSON.stringify(data, null, 2) } }
                })
              });
              log('writeGist status:', r.status);
              if (!r.ok) process.exitCode = 1;
            } catch (e) {
              log('writeGist error:', e?.message);
              process.exitCode = 1;
            }
          }
          // ================================================================
          //  BYBIT
          // ================================================================
          async function getBybitTicker(symbol) {
            const url = `${BYBIT_PUBLIC}/v5/market/tickers?category=linear&symbol=${symbol}`;
            try {
              const data = await fetchRetry(url, 2, 300);
              const t = data?.result?.list?.[0];
              if (!t) return null;
              return {
                symbol: t.symbol,
                lastPrice: +t.lastPrice,
                bid: +t.bid1Price,
                ask: +t.ask1Price,
                turnover24h: +t.turnover24h,
                fundingRate: +t.fundingRate,
                openInterest: +t.openInterest
              };
            } catch { return null; }
          }
          async function getAllLastPrices() {
            const url = `${BYBIT_PUBLIC}/v5/market/tickers?category=linear`;
            const data = await fetchRetry(url, 2, 300);
            const map = {};
            for (const t of data?.result?.list || []) {
              const p = +t.lastPrice;
              if (p > 0) map[t.symbol] = p;
            }
            return map;
          }
          // ================================================================
          //  CORE: direction = compare current price vs last exit price
          // ================================================================
          function computeDirection(trades, currentPrice) {
            if (!trades || !trades.length) return {
              direction: 'neutral', reason: 'no_trades',
              lastExit: null, moveBps: 0
            };
            const lastExit = trades.at(-1).exitPrice;
            const moveBps = (currentPrice / lastExit - 1) * 10000;
            if (moveBps > MIN_MOVE_BPS) {
              return { direction: 'long', reason: 'price_above_last_exit', lastExit, moveBps };
            }
            if (moveBps < -MIN_MOVE_BPS) {
              return { direction: 'short', reason: 'price_below_last_exit', lastExit, moveBps };
            }
            return { direction: 'neutral', reason: 'too_close_to_last_exit', lastExit, moveBps };
          }
          // ================================================================
          //  NORMALIZE TRADES FROM A WORKER
          // ================================================================
          function normalizeWorker1Trades(pnlData) {
            const bySymbol = {};
            for (const t of pnlData) {
              if (!t.symbol) continue;
              const entryPrice = +t.entryPrice || +t.avgEntryPrice || 0;
              const exitPrice  = +t.exitPrice  || +t.avgExitPrice  || 0;
              const ms = v => (v > 0 && v < 1e11) ? v * 1000 : v;
              const closedAt   = ms(+t.closedAt || +t.updatedTime || 0);
              if (!(entryPrice > 0 && exitPrice > 0 && closedAt > 0)) continue;
              if (!bySymbol[t.symbol]) bySymbol[t.symbol] = [];
              bySymbol[t.symbol].push({ entryPrice, exitPrice, closedAt });
            }
            for (const sym of Object.keys(bySymbol)) {
              bySymbol[sym].sort((a, b) => a.closedAt - b.closedAt);
            }
            return bySymbol;
          }
          function normalizeWorker2Trades(pnlData2) {
            const bySymbol = {};
            for (const t of pnlData2) {
              if (!t.symbol) continue;
              const entryPrice = +t.entryPrice || 0;
              const exitPrice  = +t.exitPrice  || 0;
              const closedAt   = +t.time || 0;
              const pnl        = +t.pnl || +t.closedPnl || 0;
              if (!(entryPrice > 0 && exitPrice > 0 && closedAt > 0)) continue;
              if (!bySymbol[t.symbol]) bySymbol[t.symbol] = [];
              bySymbol[t.symbol].push({ entryPrice, exitPrice, closedAt, pnl, raw: t });
            }
            for (const sym of Object.keys(bySymbol)) {
              bySymbol[sym].sort((a, b) => a.closedAt - b.closedAt);
            }
            return bySymbol;
          }
          // ================================================================
          //  MAIN EXECUTION
          // ================================================================
          log('╔═══════════════════════════════════════════════╗');
          log('║  Simple Entry/Exit Analyzer v' + VERSION + '          ║');
          log('╚═══════════════════════════════════════════════╝');
          const prev = await readAnalysisGist();
          const pushedPrev = prev.pushed || {};
          // Operating Mode Persistence (default to 'normal')
          let currentOperatingMode = prev.operating_mode || 'normal';
          let modeSwitchedAt = prev.mode_switched_at || 0;
          log(`Config: workerMode=${WORKER_MODE} topN=${TOP_N} pool=${WATCH_POOL} watch=${WATCH_MIN}min operatingMode=${currentOperatingMode}`);
          
          // ---- STEP 1: Fetch trades (once, shared by all passes) ----
          log('');
          log('━━━ STEP 1: Fetch worker trades (full history) ━━━');
          let pnlData = [];
          let stateData = {};
          if (USE_W1) {
            try {
              const raw = await fetchRetry(`${WORKER_URL}/pnl?limit=${PNL_LIMIT}`);
              pnlData = Array.isArray(raw) ? raw : (raw?.items || raw?.data || raw?.closedPnl || []);
              log(`Worker 1: fetched ${pnlData.length} closed trades`);
            } catch (e) {
              log('FATAL: Cannot reach worker 1 /pnl:', e?.message);
              await writeAnalysisGist({
                ts: new Date().toISOString(), version: VERSION,
                status: 'worker_unreachable', error: e?.message, ideas: [], pushed: pushedPrev
              });
              process.exit(1);
            }
          } else {
            log('Worker 1 trades: skipped (WORKER_MODE=2)');
          }
          try {
            stateData = await fetchRetry(`${WORKER_URL}/json`);
          } catch (e) {
            log('WARN: Cannot reach worker state /json:', e?.message);
          }
          let pnlData2 = [];
          if (USE_W2) {
            if (WORKER_URL_2) {
              try {
                const raw2 = await fetchRetry(`${WORKER_URL_2}/pnl`);
                pnlData2 = Array.isArray(raw2?.trades) ? raw2.trades : [];
                log(`Worker 2: fetched ${pnlData2.length} closed trades`);
              } catch (e) {
                log('WARN: Worker 2 /pnl unreachable:', e?.message);
              }
            } else {
              log('Worker 2: WORKER_URL_2 not configured.');
            }
          } else {
            log('Worker 2 trades: skipped (WORKER_MODE=1)');
          }

          // ---- DYNAMIC MODE EVALUATION BASED ON WORKER 2 TRADES ----
          log('');
          log('━━━ EVALUATING WORKER 2 PERFORMANCE FOR MODE SWITCH ━━━');
          // Parse all Worker 2 trades into a flat chronological list
          const w2TradesList = [];
          for (const rawTrade of pnlData2) {
            const closedAt = +rawTrade.time || 0;
            const pnl = +rawTrade.pnl || +rawTrade.closedPnl || 0;
            if (closedAt > 0) {
              w2TradesList.push({ closedAt, pnl, isWin: pnl > 0 });
            }
          }
          w2TradesList.sort((a, b) => a.closedAt - b.closedAt);

          // Filter trades strictly AFTER the last switch timestamp
          const postSwitchTrades = w2TradesList.filter(t => t.closedAt > modeSwitchedAt);
          log(`Total W2 trades since last switch (${new Date(modeSwitchedAt).toISOString()}): ${postSwitchTrades.length}`);

          if (postSwitchTrades.length >= 4) {
            const recent4 = postSwitchTrades.slice(-4);
            const winCount = recent4.filter(t => t.isWin).length;
            log(`Last 4 W2 trades post-switch wins: ${winCount}/4`);

            if (winCount < 2) {
              const oldMode = currentOperatingMode;
              currentOperatingMode = (currentOperatingMode === 'normal') ? 'reverse' : 'normal';
              modeSwitchedAt = Date.now();
              log(`🔄 MODE SWITCH TRIGGERED: Win count ${winCount} < 2. Switched from [${oldMode}] to [${currentOperatingMode}]`);
            } else {
              log(`✅ Operating mode maintained as [${currentOperatingMode}] (${winCount}/4 wins >= 2).`);
            }
          } else {
            log(`ℹ️ Not enough trades post-switch (${postSwitchTrades.length}/4 needed). Maintaining mode [${currentOperatingMode}].`);
          }

          const regime = stateData?.regime?.regime || 'Unknown';
          const extractOpenSyms = st => {
            const pos = Array.isArray(st?.positions)
              ? st.positions.filter(p => !(+p.size === 0)) : [];
            return { pos, syms: new Set(pos.map(p => p.symbol)) };
          };
          let { pos: positions, syms: openSyms } = extractOpenSyms(stateData);
          log(`Regime: ${regime} | Open positions: ${positions.length}`);
          const bySymbol1 = USE_W1 ? normalizeWorker1Trades(pnlData) : {};
          const bySymbol2 = USE_W2 ? normalizeWorker2Trades(pnlData2) : {};
          const sl_bps = Math.min(SL_BPS_CFG, MAX_SL_BPS);
          const tp_bps = TP_BPS_CFG;
          const arrow = d => d === 'long' ? '🔼 UP' : d === 'short' ? '🔽 DOWN' : d === 'n/a' ? '— N/A' : '⏸ FLAT';

          // ================================================================
          //  ONE FULL PASS: steps 2-7 (symbols -> prices -> trend -> watch -> top N)
          // ================================================================
          async function runPass(passMode, isFallback) {
            const tag = isFallback ? '[FALLBACK W1] ' : '';
            const useW1 = passMode === '1' || passMode === 'both';
            const useW2 = passMode === '2' || passMode === 'both';
            const res = {
              mode: passMode, fallback: isFallback, status: 'ok',
              commonSymbols: [], rows: [], perSymbolDebug: {},
              candidates: [], pool: [], watch: [], survivors: [], finalIdeas: []
            };
            if ((useW1 && !pnlData.length) || (useW2 && !pnlData2.length)) {
              log('');
              log(`${tag}Missing closed trades for mode (${passMode}). Nothing to analyze.`);
              res.status = 'insufficient_data';
              return res;
            }
            // ---- STEP 2: symbols ----
            log('');
            log(`━━━ ${tag}STEP 2: Symbols (mode ${passMode}) ━━━`);
            const commonSymbols =
              passMode === '1' ? Object.keys(bySymbol1)
              : passMode === '2' ? Object.keys(bySymbol2)
              : Object.keys(bySymbol1).filter(s => bySymbol2[s]);
            res.commonSymbols = commonSymbols;
            log(`Symbols used (mode ${passMode}): ${commonSymbols.join(', ') || '(none)'}`);
            if (!commonSymbols.length) {
              log(`${tag}No usable symbols.`);
              res.status = 'no_common_symbols';
              return res;
            }
            // ---- STEP 3: prices ----
            log('');
            log(`━━━ ${tag}STEP 3: Fetch current prices ━━━`);
            const tickers = {};
            for (const sym of commonSymbols) {
              tickers[sym] = await getBybitTicker(sym);
              await sleep(100);
              if (tickers[sym]) log(`  ${sym}: $${tickers[sym].lastPrice}`);
              else log(`  ${sym}: ticker fetch failed`);
            }
            // ---- STEP 4: direction, agreement, open-pos, cooldown ----
            log('');
            log(`━━━ ${tag}STEP 4: Trend table (lastExit vs current) ━━━`);
            const rows = res.rows;
            const perSymbolDebug = res.perSymbolDebug;
            const candidates = res.candidates;
            for (const sym of commonSymbols) {
              const ticker = tickers[sym];
              if (!ticker || !(ticker.lastPrice > 0)) continue;
              const currentPrice = ticker.lastPrice;
              const d1 = useW1 ? computeDirection(bySymbol1[sym], currentPrice) : null;
              const d2 = useW2 ? computeDirection(bySymbol2[sym], currentPrice) : null;
              const used = [d1, d2].filter(Boolean);
              const side = used[0].direction;
              const agree = side !== 'neutral' && used.every(d => d.direction === side);
              const score = used.reduce((s, d) => s + Math.abs(d.moveBps), 0) / used.length;
              let skip = null;
              if (!agree) skip = 'no_agreement';
              else if (openSyms.has(sym)) skip = 'open_position';
              else {
                const cdTs = pushedPrev[sym + '|' + side];
                if (cdTs && Date.now() - cdTs < TTL_SEC * 1000) skip = 'cooldown';
              }
              rows.push({
                symbol: sym,
                w1LastExit: d1 ? d1.lastExit : null,
                w2LastExit: d2 ? d2.lastExit : null,
                current: currentPrice,
                w1Dir: d1 ? d1.direction : 'n/a',
                w2Dir: d2 ? d2.direction : 'n/a',
                agree,
                skip
              });
              perSymbolDebug[sym] = { currentPrice, worker1: d1, worker2: d2, agree, skip };
              if (skip) continue;
              candidates.push({ symbol: sym, side, score, currentPrice, ticker });
            }

            // ---- STEP 5: score + rank ----
            candidates.sort((a, b) => b.score - a.score);
            const pool = candidates.slice(0, WATCH_POOL);
            res.pool = pool;

            // ---- STEP 6: watch phase ----
            const watch = pool.map(c => {
              const ref = c.currentPrice;
              const line = c.side === 'long'
                ? ref * (1 - ARTIFICIAL_SL_PCT / 100)
                : ref * (1 + ARTIFICIAL_SL_PCT / 100);
              return {
                ...c,
                refEntry: ref,
                elimLine: +line.toPrecision(7),
                last: ref,
                maxAdversePct: 0,
                maxFavorablePct: 0,
                eliminated: false,
                elimPrice: null,
                elimAt: null
              };
            });
            res.watch = watch;
            if (watch.length) {
              const endAt = Date.now() + WATCH_MIN * 60e3;
              while (true) {
                let prices = null;
                try { prices = await getAllLastPrices(); } catch (e) { log('  poll warn:', e?.message); }
                if (prices) {
                  for (const w of watch) {
                    if (w.eliminated) continue;
                    const p = prices[w.symbol];
                    if (!(p > 0)) continue;
                    w.last = p;
                    const adverse = w.side === 'long'
                      ? (w.refEntry - p) / w.refEntry * 100
                      : (p - w.refEntry) / w.refEntry * 100;
                    const favorable = -adverse;
                    if (adverse > w.maxAdversePct) w.maxAdversePct = adverse;
                    if (favorable > w.maxFavorablePct) w.maxFavorablePct = favorable;
                    if (adverse >= ARTIFICIAL_SL_PCT) {
                      w.eliminated = true;
                      w.elimPrice = p;
                      w.elimAt = new Date().toISOString();
                    }
                  }
                }
                if (watch.every(w => w.eliminated)) break;
                const remaining = endAt - Date.now();
                if (remaining <= 0) break;
                await sleep(Math.min(POLL_MS, remaining));
              }
            }

            // ---- STEP 7: survivors -> final ideas ----
            const survivors = watch
              .filter(w => !w.eliminated && w.last > 0)
              .filter(w => !openSyms.has(w.symbol))
              .sort((a, b) => b.score - a.score);
            res.survivors = survivors;
            const top = survivors.slice(0, TOP_N);

            res.finalIdeas = top.map(c => {
              const entry = +c.last.toPrecision(7);
              // FLIP SIDE AT THE VERY END IF OPERATING MODE IS REVERSE
              let finalSide = c.side;
              if (currentOperatingMode === 'reverse') {
                finalSide = c.side === 'long' ? 'short' : 'long';
              }

              let tp_abs, sl_abs;
              if (finalSide === 'long') {
                tp_abs = +(entry * (1 + tp_bps / 10000)).toPrecision(7);
                sl_abs = +(entry * (1 - sl_bps / 10000)).toPrecision(7);
              } else {
                tp_abs = +(entry * (1 - tp_bps / 10000)).toPrecision(7);
                sl_abs = +(entry * (1 + sl_bps / 10000)).toPrecision(7);
              }
              const rrr = +(tp_bps / sl_bps).toFixed(2);
              const basis = isFallback
                ? 'Fallback (worker 1 only): price'
                : passMode === 'both' ? 'Both workers agree: price' : `Worker ${passMode}: price`;

              const reasons = [
                `${basis} ${c.side === 'long' ? 'above' : 'below'} last exit price`,
                `Score (avg move from last exit) = ${c.score.toFixed(1)}bps`,
                `Survived ${WATCH_MIN}min watch (artificial SL ${ARTIFICIAL_SL_PCT}%, max adverse ${c.maxAdversePct.toFixed(3)}%)`
              ];
              if (currentOperatingMode === 'reverse') {
                reasons.push(`[REVERSE MODE ACTIVE] Flipped signal side from ${c.side.toUpperCase()} to ${finalSide.toUpperCase()}`);
              }

              return {
                symbol: c.symbol,
                base: c.symbol.replace('USDT', ''),
                quote: 'USDT',
                side: finalSide,
                original_side: c.side,
                operating_mode: currentOperatingMode,
                entry, tp_abs, sl_abs, tp_bps, sl_bps, rrr,
                ref_entry: c.refEntry,
                score_bps: +c.score.toFixed(1),
                fallback: isFallback,
                watch_max_adverse_pct: +c.maxAdversePct.toFixed(3),
                watch_max_favorable_pct: +c.maxFavorablePct.toFixed(3),
                funding_rate: c.ticker?.fundingRate || 0,
                volume_24h: c.ticker?.turnover24h || 0,
                reasons,
                generated_at: new Date().toISOString()
              };
            });
            return res;
          }

          // ---- Run primary pass, then fallback if needed ----
          let result = await runPass(WORKER_MODE, false);
          let fallbackUsed = false;
          const primarySummary = {
            mode: WORKER_MODE,
            status: result.status,
            candidates: result.candidates.length,
            survivors: result.survivors.length,
            ideas: result.finalIdeas.length
          };
          if (result.finalIdeas.length === 0 && WORKER_MODE === 'both') {
            log('');
            log('━━━ FALLBACK: primary (both) pass produced 0 ideas ━━━');
            if (pnlData.length) {
              log('Running fallback pass with worker 1 only.');
              fallbackUsed = true;
              result = await runPass('1', true);
            }
          }
          const { commonSymbols, rows, perSymbolDebug, candidates, pool, watch, survivors, finalIdeas } = result;

          log('');
          log(`Final ideas (${currentOperatingMode.toUpperCase()} mode): ${finalIdeas.length}`);
          for (const i of finalIdeas) {
            log(`  ${i.symbol} ${i.side.toUpperCase()} (orig: ${i.original_side.toUpperCase()}) entry=${i.entry} tp=${i.tp_abs} sl=${i.sl_abs}`);
          }

          // ---- STEP 8: Write analysis gist ----
          log('');
          log('━━━ STEP 8: Write analysis Gist ━━━');
          const pushedNext = {};
          for (const [k, ts] of Object.entries(pushedPrev)) {
            if (Date.now() - ts < PUSHED_KEEP_MS) pushedNext[k] = ts;
          }

          const pushIdeas = finalIdeas;
          const output = {
            ts: new Date().toISOString(),
            version: VERSION,
            operating_mode: currentOperatingMode,
            mode_switched_at: modeSwitchedAt,
            status: result.status,
            worker_mode: WORKER_MODE,
            fallback_used: fallbackUsed,
            primary_pass: primarySummary,
            worker_regime: regime,
            open_positions: positions.length,
            common_symbols: commonSymbols.length,
            candidates_found: candidates.length,
            watch_pool: pool.length,
            survivors: survivors.length,
            trend_table: rows,
            ideas: finalIdeas,
            pushed: pushedNext,
            config: {
              worker_mode: WORKER_MODE,
              operating_mode: currentOperatingMode,
              top_n: TOP_N, tp_bps, sl_bps, min_move_bps: MIN_MOVE_BPS, notional_usd: NOTIONAL,
              watch_min: WATCH_MIN, artificial_sl_pct: ARTIFICIAL_SL_PCT,
              watch_pool: WATCH_POOL, cooldown_sec: TTL_SEC, pnl_limit: PNL_LIMIT
            }
          };
          await writeAnalysisGist(output);
          log('Analysis Gist written with updated operating mode state.');

          // ---- STEP 9: Push ideas to worker ----
          if (PUSH_URL && PUSH_TOKEN && pushIdeas.length > 0) {
            log('');
            log('━━━ STEP 9: Push ideas to worker & confirm receipt ━━━');
            const pushPayload = {
              ts: new Date().toISOString(),
              mode: 'normal',
              source: 'simple_entry_exit_analyzer',
              meta: {
                origin: 'github_actions_analyzer', version: VERSION,
                worker_regime: regime, worker_mode: WORKER_MODE,
                operating_mode: currentOperatingMode, fallback: fallbackUsed
              },
              top_n: pushIdeas.length,
              ideas: pushIdeas.map((idea, i) => ({
                idea_id: crypto.randomUUID(),
                client_order_id: ('ta_' + crypto.randomUUID().replace(/-/g, '')).slice(0, 28),
                symbol: idea.base,
                symbol_full: idea.symbol,
                quote: idea.quote,
                side: idea.side,
                rank: i + 1,
                entry_policy: 'simple_market',
                entry_type: 'limit',
                entry_mid: idea.entry,
                entry_limit: idea.entry,
                tp_abs: idea.tp_abs,
                sl_abs: idea.sl_abs,
                tp_bps: idea.tp_bps,
                sl_bps: idea.sl_bps,
                rrr: idea.rrr,
                ttl_sec: TTL_SEC,
                reasons: idea.reasons.map(r => ({ factor: 'trend', value: r, contribution: 0 })),
                reasons_text: idea.reasons
              }))
            };
            try {
              const ac = new AbortController();
              const t = setTimeout(() => ac.abort(), 15000);
              const r = await fetch(PUSH_URL, {
                method: 'POST',
                signal: ac.signal,
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${PUSH_TOKEN}`,
                  'User-Agent': UA
                },
                body: JSON.stringify(pushPayload)
              });
              clearTimeout(t);
              let txt = '';
              try { txt = await r.text(); } catch {}
              let resJson = null;
              try { resJson = JSON.parse(txt); } catch {}
              log('Push HTTP Status:', r.status);
              const isConfirmed = r.ok && (
                !resJson || resJson.status === 'ok' || resJson.success === true ||
                resJson.received === true || resJson.ok === true
              );
              if (isConfirmed) {
                log(`✅ SUCCESS: Worker acknowledged receipt of ${pushIdeas.length} idea(s).`);
                for (const i of pushIdeas) pushedNext[i.symbol + '|' + i.side] = Date.now();
                output.pushed = pushedNext;
                await writeAnalysisGist(output);
              } else {
                log(`❌ FAILED: Push rejected or not confirmed by worker.`);
                process.exitCode = 1;
              }
            } catch (e) {
              log('❌ Push execution error:', e?.message);
              process.exitCode = 1;
            }
          }
          log('');
          log('═══ Analysis complete ═══');
          })().catch(e => { console.error('[analyzer] FATAL', e); process.exit(1); });
          NODE
          EXIT_CODE=$?
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "[analyzer] Node exited with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
