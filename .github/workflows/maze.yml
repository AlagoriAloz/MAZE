
name: Trend Analyzer (Simple Entry/Exit v4.5)
on:
  repository_dispatch:
    types: [run_X]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: trend-analyzer
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_URL_2: ${{ secrets.WORKER_URL_2 }}
      ANALYSIS_GIST_ID: ${{ secrets.ANALYSIS_GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      BINANCE_BASE_URL: ${{ secrets.BINANCE_BASE_URL }}
      WORKER_PUSH_URL: ${{ secrets.WORKER_PUSH_URL }}
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
      TOP_N: ${{ vars.ANALYZER_TOP_N }}
      MAX_SL_BPS: ${{ vars.ANALYZER_MAX_SL_BPS }}
      TP_BPS: ${{ vars.ANALYZER_TP_BPS }}
      SL_BPS: ${{ vars.ANALYZER_SL_BPS }}
      NOTIONAL_USD: ${{ vars.NOTIONAL_USD }}
      MIN_MOVE_BPS: ${{ vars.ANALYZER_MIN_MOVE_BPS }}
      WATCH_MIN: ${{ vars.ANALYZER_WATCH_MIN || vars.WATCH_MIN }}
      ARTIFICIAL_SL_PCT: ${{ vars.ANALYZER_ARTIFICIAL_SL_PCT || vars.ARTIFICIAL_SL_PCT }}
      WATCH_POOL: ${{ vars.ANALYZER_WATCH_POOL || vars.WATCH_POOL }}
      PNL_LIMIT: ${{ vars.ANALYZER_PNL_LIMIT || vars.PNL_LIMIT }}
      WORKER_MODE: ${{ vars.ANALYZER_WORKER_MODE || vars.WORKER_MODE }}
      HEDGE: ${{ vars.ANALYZER_HEDGE || vars.HEDGE }}
      REVERSE: ${{ vars.ANALYZER_REVERSE || vars.REVERSE }}
      REVERSE_MARGIN_PCT: ${{ vars.ANALYZER_REVERSE_MARGIN_PCT || vars.REVERSE_MARGIN_PCT }}
      MAX_ADVERSE_GUARD: ${{ vars.ANALYZER_MAX_ADVERSE_GUARD || vars.MAX_ADVERSE_GUARD }}
    steps:
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install watch-phase dependencies (ws)
        run: npm install ws@8 --no-save
      - name: Run Simple Entry/Exit Analyzer
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WORKER_URL:-}" ]]; then
            echo "[analyzer] Missing WORKER_URL"; exit 1
          fi
          if [[ -z "${ANALYSIS_GIST_ID:-}" || -z "${GIST_TOKEN:-}" ]]; then
            echo "[analyzer] Missing ANALYSIS_GIST_ID or GIST_TOKEN"; exit 1
          fi
          set +e
          node - <<'NODE'
          (async () => {
          'use strict';
          const crypto = require('crypto');
          const WebSocket = require('ws');
          const VERSION = '4.5.0';
          const UA = `trend-analyzer/${VERSION}`;
          const log = (...a) => console.log('[analyzer]', ...a);
          // ================================================================
          //  CONFIGURATION
          // ================================================================
          const WORKER_URL = (process.env.WORKER_URL || '').replace(/\/+$/, '');
          const WORKER_URL_2 = (process.env.WORKER_URL_2 || '').replace(/\/+$/, '');
          const ANALYSIS_GIST_ID = process.env.ANALYSIS_GIST_ID || '';
          const GIST_TOKEN = process.env.GIST_TOKEN || '';
          const PUSH_URL = process.env.WORKER_PUSH_URL || '';
          const PUSH_TOKEN = process.env.PUSH_TOKEN || '';
          const TOP_N = Math.max(1, Math.min(10, Number(process.env.TOP_N || '3')));
          const MAX_SL_BPS = Math.max(10, Math.min(300, Number(process.env.MAX_SL_BPS || '80')));
          const TP_BPS_CFG = Math.max(10, Number(process.env.TP_BPS || '100'));
          const SL_BPS_CFG = Math.max(10, Number(process.env.SL_BPS || '50'));
          const NOTIONAL = Math.max(50, Number(process.env.NOTIONAL_USD || '300'));
          // ---- CHANGED: Binance Futures REST base ----
          const BINANCE_PUBLIC = (process.env.BINANCE_BASE_URL || 'https://fapi.binance.com').replace(/\/+$/, '');
          // ---- CHANGED: Binance Futures WebSocket base ----
          const BINANCE_WS_BASE = 'wss://fstream.binance.com';
          const MIN_MOVE_BPS = Math.max(0, Number(process.env.MIN_MOVE_BPS || '5'));
          // --- Watch phase ---
          const WATCH_MIN = Math.max(0, Math.min(15, Number(process.env.WATCH_MIN || '3')));
          const ARTIFICIAL_SL_PCT = Math.max(0.01, Math.min(5, Number(process.env.ARTIFICIAL_SL_PCT || '0.3')));
          const WATCH_POOL = Math.max(TOP_N, Math.min(30, Number(process.env.WATCH_POOL || '10')));
          const POLL_MS = 10000;
          const WS_STALE_MS = 15000;
          const DEBOUNCE_TICKS = 2;
          const REST_FALLBACK_TICKS = 2;
          const TICKLOG_CAP = 60;
          // --- Full history request size ---
          const PNL_LIMIT = Math.max(100, Number(process.env.PNL_LIMIT || '1000'));
          // --- Worker mode ---
          const WORKER_MODE_RAW = String(process.env.WORKER_MODE || '').trim().toLowerCase();
          const WORKER_MODE = ['1', '2', 'both'].includes(WORKER_MODE_RAW) ? WORKER_MODE_RAW : 'both';
          const USE_W1 = WORKER_MODE === '1' || WORKER_MODE === 'both';
          const USE_W2 = WORKER_MODE === '2' || WORKER_MODE === 'both';
          // --- Hedge mode ---
          const HEDGE_RAW = String(process.env.HEDGE || '').trim().toLowerCase();
          const IS_HEDGE = ['on', 'true', '1'].includes(HEDGE_RAW);
          // --- Reverse mode ---
          const REVERSE_RAW = String(process.env.REVERSE || '').trim().toLowerCase();
          const IS_REVERSE = ['on', 'true', '1'].includes(REVERSE_RAW);
          const REVERSE_MARGIN_PCT = Math.max(0, Number(process.env.REVERSE_MARGIN_PCT || '0.6'));
          // --- Max adverse guard ---
          const MAX_ADVERSE_GUARD_RAW = String(process.env.MAX_ADVERSE_GUARD || '').trim().toLowerCase();
          const IS_MAX_ADVERSE_GUARD = ['on', 'true', '1'].includes(MAX_ADVERSE_GUARD_RAW);
          // --- Cooldown ---
          const TTL_SEC = 300;
          const PUSHED_KEEP_MS = Math.max(30 * 60e3, TTL_SEC * 1000 * 2);
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          // ================================================================
          //  HTTP HELPERS
          // ================================================================
          async function fetchJSON(url, ms = 15000) {
            const ac = new AbortController();
            const t = setTimeout(() => ac.abort(), ms);
            try {
              const r = await fetch(url, { signal: ac.signal, headers: { 'User-Agent': UA } });
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return await r.json();
            } finally { clearTimeout(t); }
          }
          async function fetchRetry(url, tries = 3, delayMs = 600) {
            for (let i = 0; i < tries; i++) {
              try { return await fetchJSON(url); }
              catch (e) {
                if (i === tries - 1) throw e;
                await sleep(delayMs * (i + 1));
              }
            }
          }
          // ================================================================
          //  EXCHANGE TIME SYNC — CHANGED: Binance Futures /fapi/v1/time
          // ================================================================
          let serverOffsetMs = 0;
          async function syncServerTime() {
            try {
              const st = await fetchJSON(`${BINANCE_PUBLIC}/fapi/v1/time`);
              const serverMs = Number(st?.serverTime);
              if (serverMs > 0) {
                serverOffsetMs = serverMs - Date.now();
                log(`Exchange time offset: ${serverOffsetMs.toFixed(0)}ms`);
              }
            } catch (e) {
              log('WARN: time sync failed, using local clock:', e?.message);
            }
          }
          const exchNow = () => Date.now() + serverOffsetMs;
          const exchISO = () => new Date(exchNow()).toISOString();
          // ================================================================
          //  GIST I/O  — UNCHANGED
          // ================================================================
          async function readAnalysisGist() {
            try {
              const r = await fetch(`https://api.github.com/gists/${ANALYSIS_GIST_ID}`, {
                headers: {
                  Authorization: `Bearer ${GIST_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'User-Agent': UA
                }
              });
              if (!r.ok) return {};
              const g = await r.json();
              const c = g.files?.['trend_analysis.json']?.content;
              return c ? JSON.parse(c) : {};
            } catch (e) {
              log('readGist warn:', e?.message);
              return {};
            }
          }
          async function writeAnalysisGist(data) {
            try {
              const r = await fetch(`https://api.github.com/gists/${ANALYSIS_GIST_ID}`, {
                method: 'PATCH',
                headers: {
                  Authorization: `Bearer ${GIST_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': UA
                },
                body: JSON.stringify({
                  files: { 'trend_analysis.json': { content: JSON.stringify(data, null, 2) } }
                })
              });
              log('writeGist status:', r.status);
              if (!r.ok) process.exitCode = 1;
            } catch (e) {
              log('writeGist error:', e?.message);
              process.exitCode = 1;
            }
          }
          // ================================================================
          //  BINANCE FUTURES REST — CHANGED: replaces getBybitTicker
          // ================================================================
          async function getBinanceTicker(symbol) {
            const url = `${BINANCE_PUBLIC}/fapi/v1/ticker/24hr?symbol=${symbol}`;
            try {
              const t = await fetchRetry(url, 2, 300);
              if (!t || !t.lastPrice) return null;
              return {
                symbol: t.symbol,
                lastPrice: +t.lastPrice,
                bid: +t.bidPrice,
                ask: +t.askPrice,
                turnover24h: +t.quoteVolume,
                fundingRate: 0,
                openInterest: 0
              };
            } catch { return null; }
          }
          // ================================================================
          //  ALL TICKERS — CHANGED: Binance Futures /fapi/v1/ticker/24hr
          // ================================================================
          async function getAllTickersFull() {
            const url = `${BINANCE_PUBLIC}/fapi/v1/ticker/24hr`;
            const data = await fetchRetry(url, 2, 300);
            const map = {};
            for (const t of Array.isArray(data) ? data : []) {
              const last = +t.lastPrice;
              if (last > 0) {
                map[t.symbol] = { last, bid: +t.bidPrice || 0, ask: +t.askPrice || 0 };
              }
            }
            return map;
          }
          // ================================================================
          //  CORE: direction = compare current price vs last exit price
          //  UNCHANGED
          // ================================================================
          function computeDirection(trades, currentPrice) {
            if (!trades || !trades.length) return {
              direction: 'neutral', reason: 'no_trades',
              lastExit: null, moveBps: 0
            };
            const lastExit = trades.at(-1).exitPrice;
            const moveBps = (currentPrice / lastExit - 1) * 10000;
            if (moveBps > MIN_MOVE_BPS) {
              return { direction: 'long', reason: 'price_above_last_exit', lastExit, moveBps };
            }
            if (moveBps < -MIN_MOVE_BPS) {
              return { direction: 'short', reason: 'price_below_last_exit', lastExit, moveBps };
            }
            return { direction: 'neutral', reason: 'too_close_to_last_exit', lastExit, moveBps };
          }
          // ================================================================
          //  NORMALIZE TRADES — UNCHANGED
          // ================================================================
          function normalizeWorker1Trades(pnlData) {
            const bySymbol = {};
            for (const t of pnlData) {
              if (!t.symbol) continue;
              const entryPrice = +t.entryPrice || +t.avgEntryPrice || 0;
              const exitPrice  = +t.exitPrice  || +t.avgExitPrice  || 0;
              const ms = v => (v > 0 && v < 1e11) ? v * 1000 : v;
              const closedAt   = ms(+t.closedAt || +t.updatedTime || 0);
              if (!(entryPrice > 0 && exitPrice > 0 && closedAt > 0)) continue;
              if (!bySymbol[t.symbol]) bySymbol[t.symbol] = [];
              bySymbol[t.symbol].push({ entryPrice, exitPrice, closedAt });
            }
            for (const sym of Object.keys(bySymbol)) {
              bySymbol[sym].sort((a, b) => a.closedAt - b.closedAt);
            }
            return bySymbol;
          }
          function normalizeWorker2Trades(pnlData2) {
            const bySymbol = {};
            for (const t of pnlData2) {
              if (!t.symbol) continue;
              const entryPrice = +t.entryPrice || 0;
              const exitPrice  = +t.exitPrice  || 0;
              const closedAt   = +t.time || 0;
              if (!(entryPrice > 0 && exitPrice > 0 && closedAt > 0)) continue;
              if (!bySymbol[t.symbol]) bySymbol[t.symbol] = [];
              bySymbol[t.symbol].push({ entryPrice, exitPrice, closedAt });
            }
            for (const sym of Object.keys(bySymbol)) {
              bySymbol[sym].sort((a, b) => a.closedAt - b.closedAt);
            }
            return bySymbol;
          }
          // ================================================================
          //  MAIN EXECUTION
          // ================================================================
          log('==================================================');
          log(`  Simple Entry/Exit Analyzer v${VERSION}`);
          log('==================================================');
          log(`Config: workerMode=${WORKER_MODE} hedge=${IS_HEDGE ? 'on' : 'off'} reverse=${IS_REVERSE ? 'on' : 'off'} reverseMarginPct=${REVERSE_MARGIN_PCT}% maxAdverseGuard=${IS_MAX_ADVERSE_GUARD ? 'on' : 'off'} topN=${TOP_N} pool=${WATCH_POOL} watch=${WATCH_MIN}min artificialSL=${ARTIFICIAL_SL_PCT}% cooldown=${TTL_SEC}s pnlLimit=${PNL_LIMIT} fallbackToW1=${WORKER_MODE === 'both'}`);
          await syncServerTime();
          const prev = await readAnalysisGist();
          const pushedPrev = prev.pushed || {};
          const cooldownActive = (sym, side) => {
            const ts = pushedPrev[sym + '|' + side];
            return !!ts && Date.now() - ts < TTL_SEC * 1000;
          };
          // ---- STEP 1: Fetch trades ----
          log('');
          log('━━━ STEP 1: Fetch worker trades (full history) ━━━');
          let pnlData = [];
          let stateData = {};
          if (USE_W1) {
            try {
              const raw = await fetchRetry(`${WORKER_URL}/pnl?limit=${PNL_LIMIT}`);
              pnlData = Array.isArray(raw) ? raw : (raw?.items || raw?.data || raw?.closedPnl || []);
              log(`Worker 1: fetched ${pnlData.length} closed trades`);
            } catch (e) {
              log('FATAL: Cannot reach worker 1 /pnl:', e?.message);
              await writeAnalysisGist({
                ts: new Date().toISOString(), version: VERSION,
                status: 'worker_unreachable', error: e?.message, ideas: [], pushed: pushedPrev
              });
              process.exit(1);
            }
          } else {
            log('Worker 1 trades: skipped (WORKER_MODE=2)');
          }
          try {
            stateData = await fetchRetry(`${WORKER_URL}/json`);
          } catch (e) {
            log('WARN: Cannot reach worker state /json:', e?.message);
          }
          let pnlData2 = [];
          if (USE_W2) {
            if (WORKER_URL_2) {
              try {
                const raw2 = await fetchRetry(`${WORKER_URL_2}/pnl`);
                pnlData2 = Array.isArray(raw2?.trades) ? raw2.trades : [];
                log(`Worker 2: fetched ${pnlData2.length} closed trades`);
              } catch (e) {
                log('WARN: Worker 2 /pnl unreachable:', e?.message);
              }
            } else {
              log('Worker 2: WORKER_URL_2 not configured.');
            }
          } else {
            log('Worker 2 trades: skipped (WORKER_MODE=1)');
          }
          const regime = stateData?.regime?.regime || 'Unknown';
          const extractOpenSyms = st => {
            const pos = Array.isArray(st?.positions)
              ? st.positions.filter(p => !(+p.size === 0)) : [];
            return { pos, syms: new Set(pos.map(p => p.symbol)) };
          };
          let { pos: positions, syms: openSyms } = extractOpenSyms(stateData);
          log(`Regime: ${regime} | Open positions: ${positions.length}`);
          const bySymbol1 = USE_W1 ? normalizeWorker1Trades(pnlData) : {};
          const bySymbol2 = USE_W2 ? normalizeWorker2Trades(pnlData2) : {};
          const sl_bps = Math.min(SL_BPS_CFG, MAX_SL_BPS);
          const tp_bps = TP_BPS_CFG;
          const arrow = d => d === 'long' ? '🔼 UP' : d === 'short' ? '🔽 DOWN' : d === 'n/a' ? '— N/A' : '⏸ FLAT';
          // ================================================================
          //  WATCH PHASE ENGINE
          //  CHANGED: WebSocket uses Binance combined stream + Binance message format
          // ================================================================
          async function runWatchPhase(pool, tag) {
            const watch = pool.map(c => {
              const ref = c.currentPrice;
              const line = c.side === 'long'
                ? ref * (1 - ARTIFICIAL_SL_PCT / 100)
                : ref * (1 + ARTIFICIAL_SL_PCT / 100);
              return {
                ...c,
                refEntry: ref,
                elimLine: +line.toPrecision(7),
                last: ref,
                maxAdversePct: 0,
                maxFavorablePct: 0,
                eliminated: false,
                elimPrice: null,
                elimAt: null,
                elimReason: null,
                wsCache: null,
                wsStrikes: 0,
                wsBreachPending: false,
                restStrikes: 0,
                tickLog: []
              };
            });
            for (const w of watch) {
              log(`  ${w.symbol} ${w.side.toUpperCase()} ref=${w.refEntry} elimLine=${w.elimLine}`);
            }
            if (!watch.length) return { watch, polls: 0, wsConnected: false };
            const byId = new Map(watch.map(w => [w.symbol, w]));
            const eliminate = (w, price, reason) => {
              w.eliminated = true;
              w.elimPrice = +price;
              w.elimAt = exchISO();
              w.elimReason = reason;
              log(`  ❌ ${tag}${w.symbol} ${w.side.toUpperCase()} eliminated @ ${price} reason=${reason}`);
            };
            // ---- CHANGED: Binance combined stream WebSocket ----
            // Build URL: wss://fstream.binance.com/stream?streams=btcusdt@ticker/ethusdt@ticker
            let ws = null, wsAlive = false, pingTimer = null;
            try {
              const streams = watch.map(w => `${w.symbol.toLowerCase()}@ticker`).join('/');
              const wsUrl = `${BINANCE_WS_BASE}/stream?streams=${streams}`;
              ws = new WebSocket(wsUrl);
              ws.on('open', () => {
                wsAlive = true;
                log(`  ${tag}WS connected (Binance), subscribed to ${watch.length} symbol(s)`);
                // Binance requires pong response to server ping frames
                // ws library handles binary ping/pong automatically
                // Send keepalive every 20s as application-level ping
                pingTimer = setInterval(() => {
                  try { ws.ping(); } catch {}
                }, 20000);
              });
              // ---- CHANGED: Binance combined stream message format ----
              // { stream: "btcusdt@ticker", data: { s, c, b, a, ... } }
              ws.on('message', (raw) => {
                let msg; try { msg = JSON.parse(raw.toString()); } catch { return; }
                if (!msg.stream || !msg.data) return;
                const d = msg.data;
                const sym = d.s;   // symbol e.g. "BTCUSDT"
                const w = byId.get(sym);
                if (!w || w.eliminated) return;
                w.wsCache = w.wsCache || {};
                if (d.b) w.wsCache.bid = +d.b;   // best bid
                if (d.a) w.wsCache.ask = +d.a;   // best ask
                if (d.c) w.wsCache.last = +d.c;  // last price
                w.wsCache.ts = Date.now();
                const trigger = w.side === 'long'
                  ? (w.wsCache.bid || w.wsCache.last)
                  : (w.wsCache.ask || w.wsCache.last);
                if (!(trigger > 0)) return;
                const adverse = w.side === 'long'
                  ? (w.refEntry - trigger) / w.refEntry * 100
                  : (trigger - w.refEntry) / w.refEntry * 100;
                if (adverse > w.maxAdversePct) w.maxAdversePct = adverse;
                if (-adverse > w.maxFavorablePct) w.maxFavorablePct = -adverse;
                if (adverse >= ARTIFICIAL_SL_PCT) {
                  w.wsStrikes++;
                  w.wsBreachPrice = trigger;
                } else {
                  w.wsStrikes = 0;
                }
                w.wsBreachPending = w.wsStrikes >= DEBOUNCE_TICKS;
              });
              ws.on('ping', () => { try { ws.pong(); } catch {} });
              ws.on('error', (e) => { wsAlive = false; log(`  ${tag}WS error:`, e?.message); });
              ws.on('close', () => { wsAlive = false; log(`  ${tag}WS closed`); });
            } catch (e) {
              log(`  ${tag}WS setup failed, REST-only fallback:`, e?.message);
            }
            // ---- REST: independent confirmation + fallback poller — UNCHANGED ----
            let polls = 0;
            const endAt = Date.now() + WATCH_MIN * 60e3;
            while (true) {
              let full = null;
              try { full = await getAllTickersFull(); } catch (e) { log(`  ${tag}REST poll warn:`, e?.message); }
              if (full) {
                polls++;
                for (const w of watch) {
                  if (w.eliminated) continue;
                  const t = full[w.symbol];
                  if (!t) continue;
                  const restTrigger = w.side === 'long' ? (t.bid || t.last) : (t.ask || t.last);
                  if (!(restTrigger > 0)) continue;
                  w.last = t.last || restTrigger;
                  const adverseRest = w.side === 'long'
                    ? (w.refEntry - restTrigger) / w.refEntry * 100
                    : (restTrigger - w.refEntry) / w.refEntry * 100;
                  if (adverseRest > w.maxAdversePct) w.maxAdversePct = adverseRest;
                  if (-adverseRest > w.maxFavorablePct) w.maxFavorablePct = -adverseRest;
                  const restBreach = adverseRest >= ARTIFICIAL_SL_PCT;
                  const wsStale = !wsAlive || !w.wsCache || (Date.now() - w.wsCache.ts > WS_STALE_MS);
                  w.tickLog.push({
                    t: exchISO(),
                    rest: { bid: t.bid, ask: t.ask, last: t.last, adversePct: +adverseRest.toFixed(4) },
                    ws: w.wsCache ? { bid: w.wsCache.bid, ask: w.wsCache.ask, strikes: w.wsStrikes } : null,
                    wsStale
                  });
                  if (w.tickLog.length > TICKLOG_CAP) w.tickLog.shift();
                  if (restBreach && w.wsBreachPending) {
                    eliminate(w, restTrigger, 'dual_source_confirmed');
                  } else if (restBreach && wsStale) {
                    w.restStrikes++;
                    if (w.restStrikes >= REST_FALLBACK_TICKS) {
                      eliminate(w, restTrigger, 'rest_only_fallback_ws_unavailable');
                    }
                  } else if (!restBreach) {
                    w.restStrikes = 0;
                  }
                }
              }
              if (watch.every(w => w.eliminated)) { log(`  ${tag}All candidates eliminated — stopping watch early.`); break; }
              const remaining = endAt - Date.now();
              if (remaining <= 0) break;
              await sleep(Math.min(POLL_MS, remaining));
            }
            if (pingTimer) clearInterval(pingTimer);
            if (ws) { try { ws.close(); } catch {} }
            log(`${tag}Watch finished (${polls} REST confirmations, WS connected=${wsAlive})`);
            for (const w of watch) {
              log(`  ${w.eliminated ? '❌' : '✅'} ${w.symbol} ${w.side.toUpperCase()} last=${w.last} maxAdverse=${w.maxAdversePct.toFixed(3)}% maxFavorable=${w.maxFavorablePct.toFixed(3)}% reason=${w.elimReason || '-'}`);
            }
            return { watch, polls, wsConnected: wsAlive };
          }
          // ================================================================
          //  ONE FULL PASS — UNCHANGED except getBinanceTicker call
          // ================================================================
          async function runPass(passMode, isFallback) {
            const tag = isFallback ? '[FALLBACK W1] ' : '';
            const useW1 = passMode === '1' || passMode === 'both';
            const useW2 = passMode === '2' || passMode === 'both';
            const res = {
              mode: passMode, fallback: isFallback, status: 'ok',
              commonSymbols: [], rows: [], perSymbolDebug: {},
              candidates: [], pool: [], watch: [], survivors: [], finalIdeas: [],
              watchMeta: { polls: 0, wsConnected: false },
              adverseGuardDropped: []
            };
            if ((useW1 && !pnlData.length) || (useW2 && !pnlData2.length)) {
              log('');
              log(`${tag}Missing closed trades for mode (${passMode}). Nothing to analyze.`);
              res.status = 'insufficient_data';
              return res;
            }
            // ---- STEP 2: symbols ----
            log('');
            log(`━━━ ${tag}STEP 2: Symbols (mode ${passMode}) ━━━`);
            log(`Worker1 symbols: ${useW1 ? (Object.keys(bySymbol1).join(', ') || '(none)') : '(not used)'}`);
            log(`Worker2 symbols: ${useW2 ? (Object.keys(bySymbol2).join(', ') || '(none)') : '(not used)'}`);
            const commonSymbols =
              passMode === '1' ? Object.keys(bySymbol1)
              : passMode === '2' ? Object.keys(bySymbol2)
              : Object.keys(bySymbol1).filter(s => bySymbol2[s]);
            res.commonSymbols = commonSymbols;
            log(`Symbols used (mode ${passMode}): ${commonSymbols.join(', ') || '(none)'}`);
            if (!commonSymbols.length) {
              log(`${tag}No usable symbols.`);
              res.status = 'no_common_symbols';
              return res;
            }
            // ---- STEP 3: prices — CHANGED: getBinanceTicker ----
            log('');
            log(`━━━ ${tag}STEP 3: Fetch current prices ━━━`);
            const tickers = {};
            for (const sym of commonSymbols) {
              tickers[sym] = await getBinanceTicker(sym);
              await sleep(100);
              if (tickers[sym]) log(`  ${sym}: $${tickers[sym].lastPrice}`);
              else log(`  ${sym}: ticker fetch failed`);
            }
            // ---- STEP 4: direction, agreement, open-pos, cooldown ----
            log('');
            log(`━━━ ${tag}STEP 4: Trend table (lastExit vs current) ━━━`);
            const rows = res.rows;
            const perSymbolDebug = res.perSymbolDebug;
            const candidates = res.candidates;
            for (const sym of commonSymbols) {
              const ticker = tickers[sym];
              if (!ticker || !(ticker.lastPrice > 0)) continue;
              const currentPrice = ticker.lastPrice;
              const d1 = useW1 ? computeDirection(bySymbol1[sym], currentPrice) : null;
              const d2 = useW2 ? computeDirection(bySymbol2[sym], currentPrice) : null;
              const used = [d1, d2].filter(Boolean);
              const side = used[0].direction;
              const agree = side !== 'neutral' && used.every(d => d.direction === side);
              const score = used.reduce((s, d) => s + Math.abs(d.moveBps), 0) / used.length;
              let skip = null;
              if (!agree) skip = 'no_agreement';
              else if (openSyms.has(sym)) skip = 'open_position';
              else if (!IS_HEDGE && cooldownActive(sym, side)) skip = 'cooldown';
              rows.push({
                symbol: sym,
                w1LastExit: d1 ? d1.lastExit : null,
                w2LastExit: d2 ? d2.lastExit : null,
                current: currentPrice,
                w1Dir: d1 ? d1.direction : 'n/a',
                w2Dir: d2 ? d2.direction : 'n/a',
                agree,
                skip
              });
              perSymbolDebug[sym] = { currentPrice, worker1: d1, worker2: d2, agree, skip };
              if (skip) continue;
              candidates.push({ symbol: sym, side, score, currentPrice, ticker });
            }
            log('');
            log('Symbol         | W1 LastExit  | W2 LastExit  | Current      | Trend(W1) | Trend(W2) | Agree? | Skip');
            log('---------------|--------------|--------------|--------------|-----------|-----------|--------|-----');
            for (const r of rows) {
              const sym = r.symbol.padEnd(14);
              const w1e = (r.w1LastExit ?? '-').toString().padEnd(12);
              const w2e = (r.w2LastExit ?? '-').toString().padEnd(12);
              const cur = r.current.toString().padEnd(12);
              const t1 = arrow(r.w1Dir).padEnd(9);
              const t2 = arrow(r.w2Dir).padEnd(9);
              const ag = r.agree ? '✅' : '❌';
              log(`${sym} | ${w1e} | ${w2e} | ${cur} | ${t1} | ${t2} | ${ag}     | ${r.skip || '-'}`);
            }
            // ---- STEP 5: score + rank -> pool ----
            log('');
            log(`━━━ ${tag}STEP 5: Score + rank candidates ━━━`);
            candidates.sort((a, b) => b.score - a.score);
            for (const c of candidates) {
              log(`  ${c.symbol} ${c.side.toUpperCase()} score=${c.score.toFixed(1)}bps`);
            }
            const pool = candidates.slice(0, WATCH_POOL);
            res.pool = pool;
            log(`Watch pool: ${pool.length} candidate(s)`);
            // ---- STEP 6: watch phase ----
            log('');
            log(`━━━ ${tag}STEP 6: Watch phase (${WATCH_MIN} min, artificial SL ${ARTIFICIAL_SL_PCT}%, dual-source confirm) ━━━`);
            const { watch, polls, wsConnected } = await runWatchPhase(pool, tag);
            res.watch = watch;
            res.watchMeta = { polls, wsConnected };
            // ---- STEP 7: survivors ----
            log('');
            log(`━━━ ${tag}STEP 7: Select top N from survivors ━━━`);
            try {
              const st2 = await fetchRetry(`${WORKER_URL}/json`, 2, 300);
              const x = extractOpenSyms(st2);
              positions = x.pos; openSyms = x.syms;
              log(`Re-checked open positions: ${positions.length}`);
            } catch (e) {
              log('WARN: re-check of open positions failed:', e?.message);
            }
            let survivors = watch
              .filter(w => !w.eliminated && w.last > 0)
              .filter(w => {
                if (openSyms.has(w.symbol)) {
                  log(`  ${w.symbol} dropped: position opened during watch`);
                  return false;
                }
                return true;
              })
              .sort((a, b) => b.score - a.score);
            res.survivors = survivors;
            if (IS_MAX_ADVERSE_GUARD) {
              const kept = [];
              for (const s of survivors) {
                if (s.maxAdversePct > s.maxFavorablePct) {
                  log(`  ${tag}${s.symbol} ${s.side.toUpperCase()} dropped by max-adverse-guard: adverse(${s.maxAdversePct.toFixed(3)}%) > favorable(${s.maxFavorablePct.toFixed(3)}%)`);
                  res.adverseGuardDropped.push({
                    symbol: s.symbol, side: s.side,
                    max_adverse_pct: +s.maxAdversePct.toFixed(3),
                    max_favorable_pct: +s.maxFavorablePct.toFixed(3)
                  });
                } else {
                  kept.push(s);
                }
              }
              log(`Max-adverse-guard: ${survivors.length - kept.length} dropped, ${kept.length} kept`);
              survivors = kept;
              res.survivors = survivors;
            }
            const eligible = survivors.filter(c => {
              const sides = IS_HEDGE ? ['long', 'short'] : [c.side];
              return sides.some(s => !cooldownActive(c.symbol, s));
            });
            const top = eligible.slice(0, TOP_N);
            log(`Survivors: ${survivors.length} | Eligible (not fully cooling down): ${eligible.length} | Selected: ${top.length}`);
            const createIdea = (c, side) => {
              const entry = +c.last.toPrecision(7);
              let tp_abs, sl_abs;
              if (side === 'long') {
                tp_abs = +(entry * (1 + tp_bps / 10000)).toPrecision(7);
                sl_abs = +(entry * (1 - sl_bps / 10000)).toPrecision(7);
              } else {
                tp_abs = +(entry * (1 - tp_bps / 10000)).toPrecision(7);
                sl_abs = +(entry * (1 + sl_bps / 10000)).toPrecision(7);
              }
              const rrr = +(tp_bps / sl_bps).toFixed(2);
              const basis = isFallback
                ? 'Fallback (worker 1 only): price'
                : passMode === 'both' ? 'Both workers agree: price' : `Worker ${passMode}: price`;
              const isPrimary = side === c.side;
              const hedgeLabel = IS_HEDGE ? ` [Hedge Mode: ${isPrimary ? 'Primary' : 'Opposite'}]` : '';
              const survivedText = `Survived ${WATCH_MIN}min dual-source watch (artificial SL ${ARTIFICIAL_SL_PCT}%, max adverse ${c.maxAdversePct.toFixed(3)}%)`;
              const hedgeText = `Hedge counterpart of ${c.side} signal (not separately watched; primary ${survivedText.charAt(0).toLowerCase()}${survivedText.slice(1)})`;
              return {
                symbol: c.symbol,
                base: c.symbol.replace('USDT', ''),
                quote: 'USDT',
                side: side,
                entry, tp_abs, sl_abs, tp_bps, sl_bps, rrr,
                ref_entry: c.refEntry,
                score_bps: +c.score.toFixed(1),
                fallback: isFallback,
                hedged: IS_HEDGE,
                hedge_leg: !isPrimary,
                watched_side: c.side,
                watch_max_adverse_pct: +c.maxAdversePct.toFixed(3),
                watch_max_favorable_pct: +c.maxFavorablePct.toFixed(3),
                funding_rate: c.ticker?.fundingRate || 0,
                volume_24h: c.ticker?.turnover24h || 0,
                reasons: [
                  `${basis} ${side === 'long' ? 'above' : 'below'} last exit price${hedgeLabel}`,
                  `Score (avg move from last exit) = ${c.score.toFixed(1)}bps`,
                  isPrimary ? survivedText : hedgeText
                ],
                generated_at: new Date().toISOString()
              };
            };
            const finalIdeas = [];
            for (const c of top) {
              const sides = IS_HEDGE ? ['long', 'short'] : [c.side];
              for (const s of sides) {
                if (cooldownActive(c.symbol, s)) {
                  log(`  ${c.symbol} ${s.toUpperCase()} skipped: cooldown`);
                  continue;
                }
                finalIdeas.push(createIdea(c, s));
              }
            }
            res.finalIdeas = finalIdeas;
            return res;
          }
          // ---- Run primary pass, then fallback if nothing to push ----
          let result = await runPass(WORKER_MODE, false);
          let fallbackUsed = false;
          const primarySummary = {
            mode: WORKER_MODE,
            status: result.status,
            candidates: result.candidates.length,
            survivors: result.survivors.length,
            ideas: result.finalIdeas.length
          };
          if (result.finalIdeas.length === 0 && WORKER_MODE === 'both') {
            log('');
            log('━━━ FALLBACK: primary (both) pass produced 0 ideas ━━━');
            if (pnlData.length) {
              log('Running fallback pass with worker 1 only.');
              fallbackUsed = true;
              result = await runPass('1', true);
            } else {
              log('Fallback skipped: no worker 1 trades available.');
            }
          }
          const { commonSymbols, rows, perSymbolDebug, candidates, pool, watch, survivors, finalIdeas, watchMeta, adverseGuardDropped } = result;
          // ================================================================
          //  REVERSE (2-tier) — UNCHANGED
          // ================================================================
          const reverseSkippedSymbols = [];
          const pushIdeas = IS_REVERSE
            ? finalIdeas.map(idea => {
                const margin = idea.watch_max_favorable_pct - idea.watch_max_adverse_pct;
                if (margin > REVERSE_MARGIN_PCT) {
                  log(`  ${idea.symbol} ${idea.side.toUpperCase()} DROPPED: margin=${margin.toFixed(3)}% > ${REVERSE_MARGIN_PCT}% (clean move, skipping symbol)`);
                  reverseSkippedSymbols.push({
                    symbol: idea.symbol, side: idea.side,
                    margin_pct: +margin.toFixed(3)
                  });
                  return null;
                }
                const flippedSide = idea.side === 'long' ? 'short' : 'long';
                const entry = idea.entry;
                let tp_abs, sl_abs;
                if (flippedSide === 'long') {
                  tp_abs = +(entry * (1 + idea.tp_bps / 10000)).toPrecision(7);
                  sl_abs = +(entry * (1 - idea.sl_bps / 10000)).toPrecision(7);
                } else {
                  tp_abs = +(entry * (1 - idea.tp_bps / 10000)).toPrecision(7);
                  sl_abs = +(entry * (1 + idea.sl_bps / 10000)).toPrecision(7);
                }
                log(`  ${idea.symbol} ${idea.side.toUpperCase()} reversed → ${flippedSide.toUpperCase()}: margin=${margin.toFixed(3)}% <= ${REVERSE_MARGIN_PCT}%`);
                return { ...idea, side: flippedSide, tp_abs, sl_abs };
              }).filter(Boolean)
            : finalIdeas;
          log('');
          log(`Final ideas: ${finalIdeas.length}${fallbackUsed ? ' (from fallback)' : ''}${IS_REVERSE ? ` [REVERSE MODE ON, margin=${REVERSE_MARGIN_PCT}%]` : ''}${IS_MAX_ADVERSE_GUARD ? ' [MAX-ADVERSE-GUARD ON]' : ''}`);
          if (IS_REVERSE && reverseSkippedSymbols.length) {
            log(`Reverse-skip dropped ${reverseSkippedSymbols.length} symbol(s): ${reverseSkippedSymbols.map(s => s.symbol).join(', ')}`);
          }
          for (const i of pushIdeas) {
            log(`  ${i.symbol} ${i.side.toUpperCase()} entry=${i.entry} tp=${i.tp_abs} sl=${i.sl_abs} score=${i.score_bps}bps${i.hedge_leg ? ' (hedge leg)' : ''}`);
          }
          // ---- STEP 8: Write analysis gist ----
          log('');
          log('━━━ STEP 8: Write analysis Gist ━━━');
          const pushedNext = {};
          for (const [k, ts] of Object.entries(pushedPrev)) {
            if (Date.now() - ts < PUSHED_KEEP_MS) pushedNext[k] = ts;
          }
          const output = {
            ts: new Date().toISOString(),
            version: VERSION,
            status: result.status,
            worker_mode: WORKER_MODE,
            hedge_mode: IS_HEDGE,
            reverse_mode: IS_REVERSE,
            reverse_margin_pct: REVERSE_MARGIN_PCT,
            reverse_skipped_symbols: reverseSkippedSymbols,
            max_adverse_guard: IS_MAX_ADVERSE_GUARD,
            fallback_used: fallbackUsed,
            primary_pass: primarySummary,
            worker_regime: regime,
            open_positions: positions.length,
            common_symbols: commonSymbols.length,
            candidates_found: candidates.length,
            watch_pool: pool.length,
            survivors: survivors.length,
            max_adverse_guard_dropped: adverseGuardDropped,
            watch_engine: {
              rest_confirmations: watchMeta.polls,
              ws_connected: watchMeta.wsConnected,
              debounce_ticks: DEBOUNCE_TICKS,
              rest_fallback_ticks: REST_FALLBACK_TICKS,
              ws_stale_ms: WS_STALE_MS,
              server_offset_ms: +serverOffsetMs.toFixed(0)
            },
            trend_table: rows,
            watch_results: watch.map(w => ({
              symbol: w.symbol,
              side: w.side,
              score_bps: +w.score.toFixed(1),
              ref_entry: w.refEntry,
              elim_line: w.elimLine,
              last: w.last,
              max_adverse_pct: +w.maxAdversePct.toFixed(3),
              max_favorable_pct: +w.maxFavorablePct.toFixed(3),
              eliminated: w.eliminated,
              elim_price: w.elimPrice,
              elim_at: w.elimAt,
              elim_reason: w.elimReason,
              tick_log: w.tickLog
            })),
            ideas: pushIdeas,
            debug_per_symbol: perSymbolDebug,
            pushed: pushedNext,
            config: {
              worker_mode: WORKER_MODE,
              hedge: IS_HEDGE,
              reverse: IS_REVERSE,
              reverse_margin_pct: REVERSE_MARGIN_PCT,
              max_adverse_guard: IS_MAX_ADVERSE_GUARD,
              top_n: TOP_N, tp_bps, sl_bps, min_move_bps: MIN_MOVE_BPS, notional_usd: NOTIONAL,
              watch_min: WATCH_MIN, artificial_sl_pct: ARTIFICIAL_SL_PCT,
              watch_pool: WATCH_POOL, cooldown_sec: TTL_SEC, pnl_limit: PNL_LIMIT
            }
          };
          await writeAnalysisGist(output);
          log('Analysis Gist written.');
          // ---- STEP 9: Push ideas to worker & confirm receipt ----
          if (PUSH_URL && PUSH_TOKEN && pushIdeas.length > 0) {
            log('');
            log('━━━ STEP 9: Push ideas to worker & confirm receipt ━━━');
            const pushPayload = {
              ts: new Date().toISOString(),
              mode: 'normal',
              source: 'simple_entry_exit_analyzer',
              meta: {
                origin: 'github_actions_analyzer', version: VERSION,
                worker_regime: regime, worker_mode: WORKER_MODE,
                hedge: IS_HEDGE, reverse: IS_REVERSE, reverse_margin_pct: REVERSE_MARGIN_PCT, max_adverse_guard: IS_MAX_ADVERSE_GUARD, fallback: fallbackUsed
              },
              top_n: pushIdeas.length,
              ideas: pushIdeas.map((idea, i) => ({
                idea_id: crypto.randomUUID(),
                client_order_id: ('ta_' + crypto.randomUUID().replace(/-/g, '')).slice(0, 28),
                symbol: idea.base,
                symbol_full: idea.symbol,
                quote: idea.quote,
                side: idea.side,
                rank: i + 1,
                entry_policy: 'simple_market',
                entry_type: 'limit',
                entry_mid: idea.entry,
                entry_limit: idea.entry,
                tp_abs: idea.tp_abs,
                sl_abs: idea.sl_abs,
                tp_bps: idea.tp_bps,
                sl_bps: idea.sl_bps,
                rrr: idea.rrr,
                ttl_sec: TTL_SEC,
                hedge_leg: idea.hedge_leg,
                reasons: idea.reasons.map(r => ({ factor: 'trend', value: r, contribution: 0 })),
                reasons_text: idea.reasons
              }))
            };
            try {
              const ac = new AbortController();
              const t = setTimeout(() => ac.abort(), 15000);
              const r = await fetch(PUSH_URL, {
                method: 'POST',
                signal: ac.signal,
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${PUSH_TOKEN}`,
                  'User-Agent': UA
                },
                body: JSON.stringify(pushPayload)
              });
              clearTimeout(t);
              let txt = '';
              try { txt = await r.text(); } catch {}
              let resJson = null;
              try { resJson = JSON.parse(txt); } catch {}
              log('Push HTTP Status:', r.status);
              const isConfirmed = r.ok && (
                !resJson ||
                resJson.status === 'ok' ||
                resJson.success === true ||
                resJson.received === true ||
                (typeof resJson.accepted_count === 'number' && resJson.accepted_count > 0) ||
                (Array.isArray(resJson.received_ids) && resJson.received_ids.length > 0) ||
                resJson.ok === true
              );
              if (isConfirmed) {
                log(`✅ SUCCESS: Worker acknowledged receipt of ${pushIdeas.length} idea(s).`);
                if (resJson) log('Worker Response Payload:', JSON.stringify(resJson));
                for (const i of pushIdeas) pushedNext[i.symbol + '|' + i.side] = Date.now();
                output.pushed = pushedNext;
                output.push_confirmation = {
                  received: true,
                  count: pushIdeas.length,
                  ts: new Date().toISOString(),
                  response: resJson || txt
                };
                await writeAnalysisGist(output);
              } else {
                log(`❌ FAILED: Push rejected or not confirmed by worker. Response:`, (txt || '').slice(0, 300));
                output.push_confirmation = {
                  received: false,
                  status: r.status,
                  ts: new Date().toISOString(),
                  response: resJson || txt
                };
                await writeAnalysisGist(output);
                process.exitCode = 1;
              }
            } catch (e) {
              log('❌ Push execution error:', e?.message);
              output.push_confirmation = {
                received: false,
                error: e?.message,
                ts: new Date().toISOString()
              };
              await writeAnalysisGist(output);
              process.exitCode = 1;
            }
          } else if (pushIdeas.length === 0) {
            log('');
            log('No new ideas to push.');
          } else {
            log('');
            log('Push skipped (no WORKER_PUSH_URL or PUSH_TOKEN).');
          }
          log('');
          log('═══ Analysis complete ═══');
          })().catch(e => { console.error('[analyzer] FATAL', e); process.exit(1); });
          NODE
          EXIT_CODE=$?
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "[analyzer] Node exited with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
