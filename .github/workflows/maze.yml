          function cleanExpiredCooldowns(state){ const now=Date.now(); if(state.cooldown){ for(const [base,ts] of Object.entries(state.cooldown)){ if(now-ts>=COOLDOWN_MS){ delete state.cooldown[base]; } } } if(state.cooldown_side){ for(const [base,obj] of Object.entries(state.cooldown_side)){ if(now-(obj.ts_ms||0)>=COOLDOWN_MS){ delete state.cooldown_side[base]; } } } if(state.mr_lockout){ for(const [sym,expiry] of Object.entries(state.mr_lockout)){ if(now>=expiry){ delete state.mr_lockout[sym]; } } } log(`🧹 Cleaned cooldowns: ${Object.keys(state.cooldown||{}).length} base, ${Object.keys(state.cooldown_side||{}).length} side, ${Object.keys(state.mr_lockout||{}).length} mr_lockout`); }
