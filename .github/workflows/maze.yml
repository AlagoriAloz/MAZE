                exp_lcb_bps:x.exp_lcb_bps, ev_bps:x.ev_bps, cost_bps:x.cost_bps, p_win:x.p_lcb, p_lcb:x.p_lcb,
                p_raw:x.p_raw, calib_key:`side:${x.side}|regime:${x.regime}`, regime:x.regime, ttl_sec:ttl, size_bps,
                predicted:{ ts_ms:Date.now(), p_cal:x.p_lcb, ev_bps:x.exp_lcb_bps??x.exp_bps, confidence_score:x.confidence,
                  flipped:x.flipped||false, vol_1h_pct:x.price_24h_pct, funding_rate:Math.abs(x.funding_rate_raw||0),
                  oi_delta_pct:0, volume_1h_usd:x.volume_24h_usd, basis_bps:0, hedge_confidence:x.confidence },
                confidence:x.confidence, reasons:x.reasons,
                reasons_text:(x.reasons||[]).slice(0,3).map(r=>`${r.factor}:${r.value}(${r.contribution>=0?"+":""}${r.contribution})`),
                hedge_metrics:{ price_24h_pct:x.price_24h_pct, funding_rate_raw:x.funding_rate_raw,
                  volume_24h_usd:x.volume_24h_usd, mark_price:x.mark_price,
                  liq_price:x.liq_price, target_price:x.target_price,
                  prediction_error_bps:x.prediction_error_bps, score:x.score }
              };
            });

            if (HEDGE) {
              const flippedPicks = picksV2.map(orig=>{
                const flippedSide=orig.side==="long"?"short":"long";
                const mid=orig.entry_mid;
                const slF=orig.sl_bps/10000, tpF=orig.tp_bps/10000;
                let entry_limit=null, tp_abs=null, sl_abs=null;
                if(mid!=null){
                  if(flippedSide==="long"){ entry_limit=mid*(1-Math.max(0.001,slF*0.5)); tp_abs=entry_limit*(1+tpF); sl_abs=entry_limit*(1-slF); }
                  else { entry_limit=mid*(1+slF); tp_abs=entry_limit*(1-tpF); sl_abs=entry_limit*(1+slF); }
                }
                return { ...orig, idea_id:uuidv4(), client_order_id:mkClientOrderId("bnh"), side:flippedSide, entry_limit, tp_abs, sl_abs, calib_key:`side:${flippedSide}|regime:${orig.regime}`, hedge_pair_of:orig.idea_id, is_hedge_flip:true };
              });
              picksV2=[...picksV2,...flippedPicks];
              log(`🔁 HEDGE ON: ${picksV2.length} ideas total (${picksV2.length/2} pairs)`);
            }

            const toV1Compat=(pv2)=>({
              idea_id:pv2.idea_id, client_order_id:pv2.client_order_id, symbol:pv2.symbol, symbol_full:pv2.symbol_full,
              quote:pv2.quote, side:pv2.side, rank:pv2.rank, entry_policy:"smart_swing_limit", entry_type:"limit",
              activation:"on_fill", entry_mid:pv2.entry_mid, entry_limit:pv2.entry_limit, tp_abs:pv2.tp_abs, sl_abs:pv2.sl_abs,
              tp_bps:pv2.tp_bps, sl_bps:pv2.sl_bps, rrr:pv2.rrr, exp_lcb_bps:pv2.exp_lcb_bps, ev_bps:pv2.ev_bps,
              cost_bps:pv2.cost_bps, p_win:pv2.p_lcb, p_lcb:pv2.p_lcb, p_raw:pv2.p_raw, calib_key:pv2.calib_key,
              regime:pv2.regime, ttl_sec:pv2.ttl_sec, size_bps:pv2.size_bps,
              predicted:{ ...pv2.predicted, meta:{ strategy:STRATEGY_NAME, model_version:MODEL_VERSION, schema_version:SCHEMA_VERSION, git_sha:GIT_SHA, config_hash:CONFIG_HASH,
                futures_hint:{ target_exchange:pv2.target_exchange, market_type:pv2.market_type, margin_mode:pv2.margin_mode, leverage:pv2.leverage, entry_policy_override:pv2.entry_policy, exec:pv2.exec } } },
              confidence:pv2.confidence, reasons:pv2.reasons, reasons_text:pv2.reasons_text, hedge_metrics:pv2.hedge_metrics
            });
            let picks = picksV2.map(toV1Compat);

            try {
              const maxVolPick=Math.max(...picks.map(p=>Math.abs(p.predicted?.vol_1h_pct||1)));
              if(maxVolPick>15){ const scale=clamp(15/maxVolPick,0.4,1); picks=picks.map(p=>({...p,size_bps:Math.max(4,Math.round(p.size_bps*scale))})); log("[gha] High volatility detected, scaling sizes by",scale.toFixed(2)); }
            } catch(e){ log("[gha] Portfolio risk adjustment warn", e?.message||e); }

            try {
              const nowMs=Date.now(); const ideasTs=new Date(nowMs).toISOString();
              for(const p of picks){
                state.cooldown[p.symbol]=nowMs;
                state.cooldown_side[p.symbol]={ side:p.side, ts_ms:nowMs };
                state.pending.push({ ts:ideasTs, ts_ms:nowMs, ttl_ts_ms:nowMs+p.ttl_sec*1000, symbolFull:p.symbol_full, flipped:p.predicted?.flipped||false, base:p.symbol, quote:p.quote, side:p.side, entry_limit:p.entry_limit, tp_abs:p.tp_abs, sl_abs:p.sl_abs, hold_sec:p.ttl_sec, tp_bps:p.tp_bps, sl_bps:p.sl_bps, cost_bps:p.cost_bps, tier:p.tier||"confidence", p_lcb:p.p_lcb, p_raw:p.p_raw, calib_key:p.calib_key, predicted:p.predicted, regime:p.regime, decision_context:{ source:"binance_futures_gainers_losers", hedge_metrics:p.hedge_metrics }, notional_usd:NOTIONAL, size_bps:p.size_bps, idea_id:p.idea_id, client_order_id:p.client_order_id, hedge_metrics:p.hedge_metrics, status:"planned", entry_ts_ms:null, entry_price:null, qty:null });
              }
              if(state.pending.length>550) state.pending=state.pending.slice(-550);
              log("DEBUG: Appended",picks.length,"plans. pending=",(state.pending||[]).length);
            } catch(e){ log("state update warn", e?.message||e); }

            const auditOut = buildAuditOutputs(state);
            await saveState(persist, state, auditOut, 2, true);

            for(const p of picks) log(`idea ${p.symbol_full} ${p.side} conf=${p.confidence} 24h=${(p.hedge_metrics?.price_24h_pct||0).toFixed(2)}% fund=${((p.hedge_metrics?.funding_rate_raw||0)*100).toFixed(4)}% reasons=${(p.reasons_text||[]).join("; ")}`);
            const ideaLogs=picks.map(p=>({ symbol:p.symbol_full, side:p.side, flipped:p.predicted?.flipped||false, confidence:p.confidence, price_24h_pct:+(p.hedge_metrics?.price_24h_pct||0).toFixed(2), funding_rate:+(p.hedge_metrics?.funding_rate_raw||0).toFixed(5), volume_24h_usd:Math.round((p.hedge_metrics?.volume_24h_usd||0)/1e6)+"M", reasons:p.reasons_text, p_cal:+p.p_lcb.toFixed(3), ev_bps:p.ev_bps, idea_id:p.idea_id }));

            const meta={
              origin:"github_actions", reason, exchange:"binance_futures", execution_exchange:"binance_futures",
              strategy:STRATEGY_NAME, model_version:MODEL_VERSION, schema_version:SCHEMA_VERSION, git_sha:GIT_SHA, config_hash:CONFIG_HASH,
              counts:{ binance_universe:binanceUniverseCount, metrics_fetched:filteredTickers.length, selected:picks.length, hedge_mode:HEDGE, symbols_analyzed:HEDGE?picks.length/2:picks.length },
              dd_gate:{ pnl24_bps, peak_dd_bps, throttle },
              tod:{ active:S_H!=null&&E_H!=null, start:S_H, end:E_H },
              heartbeat:{ mismatches:0, zombies:0 }, tier:selectionTier, idea_logs:ideaLogs,
              calibration_health:calibHealth,
              extras:{ v2_ideas:picksV2, features_requested:["maker_join","post_only","linear","hedge_trading","binance_execution"] }
            };
            const payload={ ts:new Date().toISOString(), mode:"normal", source:"external_pusher", meta, top_n:picks.length||0, ideas:picks||[] };

            log(`pushing ${picks.length} ideas (${selectionTier}) to ${PUSH_URL}`);
            try{
              const r=await fetchWithTimeout(PUSH_URL,{ method:"POST", headers:{ "Content-Type":"application/json","Authorization":"Bearer "+PUSH_TOKEN }, body:JSON.stringify(payload) },15000);
              let txt=""; try{ txt=await r.text(); }catch{}
              log("push status",r?.status||"ERR",(txt||"").slice(0,400));
            }catch(e){ log("push failed",e?.message||e); }

            if(PUSH_URL_V2){
              const payloadV2={ ts:new Date().toISOString(), mode:"normal", source:"external_pusher",
                meta:{ origin:"github_actions_v2_binance", strategy:"binance-hedge-ultimate", data_source:"binance_futures_gainers_losers", execution:"binance_futures" },
                top_n:picksV2.length, ideas:picksV2 };
              log(`pushing ${picksV2.length} v2 ideas to ${PUSH_URL_V2}`);
              try{
                const r2=await fetchWithTimeout(PUSH_URL_V2,{ method:"POST", headers:{ "Content-Type":"application/json","Authorization":"Bearer "+PUSH_TOKEN }, body:JSON.stringify(payloadV2) },15000);
                let txt2=""; try{ txt2=await r2.text(); }catch{}
                log("push v2 status",r2?.status||"ERR",(txt2||"").slice(0,400));
              }catch(e){ log("push v2 failed",e?.message||e); }
            }

          }catch(e){
            reason=reason!=="ok"?reason:"data_error";
            const payload={ ts:new Date().toISOString(), mode:"normal", source:"external_pusher",
              meta:{ origin:"github_actions", reason, error:(e?.message||String(e)).slice(0,220), exchange:"binance_futures" },
              top_n:0, ideas:[] };
            log("pushing 0 ideas to",PUSH_URL);
            try{
              const r=await fetchWithTimeout(PUSH_URL,{ method:"POST", headers:{ "Content-Type":"application/json","Authorization":"Bearer "+PUSH_TOKEN }, body:JSON.stringify(payload) },15000);
              let txt=""; try{ txt=await r.text(); }catch{}
              log("push status",r?.status||"ERR",(txt||"").slice(0,200));
            }catch(e2){ log("push failed",e2?.message||e2); }
          }
          })();
          NODE

          EXIT_CODE=$?

          set -e
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "[gha] pusher exited with code $EXIT_CODE — sending minimal payload"
            raw_push_url="$(printf '%s' "${WORKER_PUSH_URL}" | tr -d '\r\n')"
            health_url="$(printf '%s' "${raw_push_url}" | sed -E 's#/signals/push(\?.*)?$#/health#')"
            echo "[gha] fallback health GET ${health_url}"
            http_code_h=$(curl -g -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${PUSH_TOKEN}" --max-time 8 "${health_url}" || true)
            echo "[gha] fallback health status ${http_code_h}"
            now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            payload='{"ts":"'"${now}"'","mode":"normal","source":"external_pusher","meta":{"origin":"github_actions","reason":"fallback_node_error","exchange":"binance_futures"},"top_n":0,"ideas":[]}'
            echo "[gha] pushing 0 ideas to ${raw_push_url}"
            mkdir -p /tmp
            : > /tmp/push_resp.txt
            http_code=$(curl -g -sS -o /tmp/push_resp.txt -w "%{http_code}" -X POST -H "Content-Type: application/json" -H "Authorization: Bearer ${PUSH_TOKEN}" --data-raw "${payload}" --max-time 12 "${raw_push_url}" || true)
            body="$(head -c 400 /tmp/push_resp.txt || true)"
            echo "[gha] push status ${http_code} ${body}"
            exit 0
          fi
