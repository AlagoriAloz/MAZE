          function calculateLiquidationProbability(mtfData, currentPrice, side, leverage) {
            const lev = leverage || LEVERAGE || 5;
            const liqPrice = side === 'long'
              ? currentPrice * (1 - 0.9 / lev)
              : currentPrice * (1 + 0.9 / lev);
            const liqDistance = Math.abs((liqPrice - currentPrice) / currentPrice);
            const getReturns = (candles) => {
              const closes = candles.map(c => parseFloat(c[4]));
              const rets = [];
              for (let i = 1; i < closes.length; i++) rets.push(Math.log(closes[i] / closes[i-1]));
              return rets;
            };
            const ret4h = getReturns(mtfData.k4h);
            const ret1h = getReturns(mtfData.k1h);
            const ret15m = getReturns(mtfData.k15m);
            const ret5m = getReturns(mtfData.k5m);
            const vol4h  = std(ret4h)  * Math.sqrt(1);
            const vol1h  = std(ret1h)  * Math.sqrt(4);
            const vol15m = std(ret15m) * Math.sqrt(16);
            const vol5m  = std(ret5m)  * Math.sqrt(48);
            const volWeighted = (0.15*vol4h + 0.25*vol1h + 0.30*vol15m + 0.30*vol5m);
            const numSims = 500, stepsPerSim = 48, dt = 1/stepsPerSim;
            let liqCount = 0;
            for (let sim = 0; sim < numSims; sim++) {
              let price = currentPrice;
              for (let step = 0; step < stepsPerSim; step++) {
                const shock = volWeighted * Math.sqrt(dt) * randt(5);
                price *= (1 + shock);
                if (side === 'long' && price <= liqPrice) { liqCount++; break; }
                if (side === 'short' && price >= liqPrice) { liqCount++; break; }
              }
            }
            const pLiq = liqCount / numSims;
            return { p_liquidation: +pLiq.toFixed(4), liq_price: +liqPrice.toFixed(2), liq_distance_pct: +(liqDistance*100).toFixed(2), vol_weighted: +volWeighted.toFixed(6) };
          }

