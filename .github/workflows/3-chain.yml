name: 3 — Chain End

on:
  repository_dispatch:
    types: [run_3]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log trigger source
        run: |
          echo "Triggered by: ${{ github.event.client_payload.source || 'chain_2' }}"

      - name: Sleep 1 minute
        run: sleep 60

      - name: Trigger X + restart Chain 1
        env:
          PAT: ${{ secrets.PAT_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"run_X"}'

          curl -s -X POST \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"run_1","client_payload":{"source":"chain_3_loop"}}'
