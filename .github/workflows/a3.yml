name: 🔄 A3 (20 min)
on:
  repository_dispatch:
    types: [run_A3]
  workflow_dispatch: {}
permissions:
  actions: write
  contents: write
jobs:
  a3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🛡️ Guard - cancel if another A3 is running
        id: guard
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const myRunId = context.runId;
            const me = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: myRunId });
            const workflowId = me.data.workflow_id;
            const others = [];
            for (const status of ['in_progress', 'queued', 'waiting', 'pending']) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflowId, status, per_page: 100
              });
              for (const run of runs.data.workflow_runs) {
                if (run.id !== myRunId && run.id < myRunId) { others.push(run); }
              }
            }
            if (others.length === 0) {
              core.setOutput('skip', 'false');
              return;
            }
            core.setOutput('skip', 'true');
            await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: myRunId });
      - name: 🚀 A3 Work
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "⏳ A3 started at $(date)"
          sleep 300  # 20 minutes
          echo "✅ A3 done at $(date)"
      - name: 🔁 Trigger X and Restart Loop (A1)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 1. Trigger X (Ideas Pusher)
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'run_X'
            });
            console.log('✅ Dispatched run_X');
            // 2. Trigger A1 (Restart the loop)
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'run_A1'
            });
            console.log('✅ Dispatched run_A1');
