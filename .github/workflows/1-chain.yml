name: "1 — Chain Starter"

on:
  repository_dispatch:
    types: [run_1]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: chain-1
  cancel-in-progress: true

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Do work (~20 min)
        shell: bash
        run: |
          echo "[1] Starting work..."
          # ── PUT YOUR REAL LOGIC HERE ──
          sleep 1200
          echo "[1] Work complete."

      - name: Trigger Workflow 2
        if: always()
        shell: bash
        run: |
          echo "[1] Dispatching run_2 ..."
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"run_2"}'
          echo "[1] Dispatched."
