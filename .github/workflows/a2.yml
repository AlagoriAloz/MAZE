name: 🔄 A2 (20 min)
on:
  repository_dispatch:
    types: [run_A2]
permissions:
  actions: write
  contents: write
jobs:
  a2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🚀 A2 Work
        run: |
          echo "⏳ A2 started at $(date)"
          sleep 300  # 20 minutes
          echo "✅ A2 done at $(date)"
      - name: ➡️ Trigger A3
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'run_A3'
            });
            console.log('✅ Triggered A3');
